/* ---------- pattern maker (nested circles, canvas) ---------- */
const TAU=Math.PI*2;
const PSPEC=[
  ['count','Petals',3,7,0.1,v=>v.toFixed(1)],
  ['scale','Bloom',0.28,0.55,0.005,v=>Math.round(v*100)+'%'],
  ['twist','Twist',0,120,0.5,v=>Math.round(v)+'\u00b0'],
  ['hue','Hue',0,360,1,v=>Math.round(v)+'\u00b0']
];
const PDEF={count:5,scale:0.4,twist:24,hue:28};
/* easing curves: t and the result both run from 0 to 1 */
const ease={
  inOutCubic:t=>t&lt;.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5)
};
function normPattern(o){
  const out={};
  PSPEC.forEach(sp=>{
    const v=(o&amp;&amp;typeof o==='object')?Number(o[sp[0]]):NaN;
    out[sp[0]]=isFinite(v)?Math.min(sp[3],Math.max(sp[2],v)):PDEF[sp[0]];
  });
  return out;
}
let pat=normPattern(null);          /* where the sliders point (saved and published) */
const cur=Object.assign({},PDEF);   /* what is drawn right now, easing toward pat */
const patIn={},patOut={};
let tween=null,patRaf=0,patLast=0,patSeen=true,patSaveTimer=null;
let quality=1,frameEma=16.7,frameCount=0;
const calm=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function syncControl(sp,v){
  const k=sp[0];
  patIn[k].value=v;
  patOut[k].textContent=sp[5](v);
  patIn[k].style.setProperty('--p',((v-sp[2])/(sp[3]-sp[2])*100)+'%');
  if(k==='hue')patIn[k].style.setProperty('--c','hsl('+Math.round(v)+',95%,58%)');
}
function stepPattern(now){
  const dt=Math.min(.05,Math.max(0,(now-patLast)/1000));
  let moving=false;
  if(tween){
    const t=Math.min(1,(now-tween.t0)/tween.dur),e=tween.fn(t);
    PSPEC.forEach(sp=>{
      const k=sp[0];
      cur[k]=tween.from[k]+(tween.to[k]-tween.from[k])*e;
      syncControl(sp,cur[k]);
    });
    if(t>=1)tween=null;
    moving=true;
  }else{
    /* frame-rate independent glide toward the slider values */
    const a=1-Math.exp(-dt/.16);
    PSPEC.forEach(sp=>{
      const k=sp[0],d=pat[k]-cur[k];
      if(Math.abs(d)>(sp[3]-sp[2])*2e-4){cur[k]+=d*a;moving=true;}
      else cur[k]=pat[k];
    });
  }
  return moving;
}
function drawPattern(now){
  const c=$('patCanvas');
  const dpr=Math.min(2,window.devicePixelRatio||1)*quality;
  const w=Math.round(c.clientWidth*dpr);
  if(!w)return;
  if(c.width!==w||c.height!==w){c.width=w;c.height=w;}
  const g=c.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,w,w);
  g.globalCompositeOperation='lighter';
  const still=calm(),t=still?0:now/1000;
  const scale=cur.scale+(still?0:Math.sin(t*.45)*.012);
  const count=cur.count,step=TAU/count,twist=cur.twist*Math.PI/180;
  const DEPTH=4,cols=[],dens=Math.min(1,5.2/count);   /* more petals overlap more, so soften them */
  for(let d=0;d&lt;=DEPTH;d++)cols.push('hsl('+(((cur.hue+d*9)%360+360)%360)+',92%,'+(60+d*3)+'%)');
  const ring=(cx,cy,r,d,ang,a)=>{
    if(a&lt;.01)return;
    g.globalAlpha=a*(.75-d*.11)*dens;
    g.lineWidth=(1.15-d*.15)*dpr;
    g.strokeStyle=cols[d];
    g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();
    if(d>=DEPTH)return;
    const cr=r*scale,dist=r-cr,n=Math.ceil(count-1e-6);
    for(let i=0;i&lt;n;i++){
      const aa=ang+i*step;
      /* a fractional petal fades in, so changing the count never pops */
      ring(cx+Math.cos(aa)*dist,cy+Math.sin(aa)*dist,cr,d+1,ang+twist,a*Math.min(1,count-i));
    }
  };
  ring(w/2,w/2,w/2-3*dpr,0,t*.05,1);
  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
}
/* if frames run slow, draw at a slightly lower resolution; creep back up when there is headroom */
function adaptQuality(ms){
  frameEma=frameEma*.92+Math.min(100,ms)*.08;
  if(++frameCount%30)return;
  if(frameEma>24&amp;&amp;quality>.55)quality=Math.max(.55,quality-.15);
  else if(frameEma&lt;17.5&amp;&amp;quality&lt;1)quality=Math.min(1,quality+.05);
}
/* the calendar's accent colors follow the Hue slider (today sits a little warmer than the rest) */
let accentHue=-1;
const hueGap=(h,c)=>(((h-c+180)%360)+360)%360-180;
/* even out how bright each hue feels: blues a touch lighter, greens a touch softer */
function lightFor(h){return 50+13*Math.exp(-Math.pow(hueGap(h,245)/45,2))-6*Math.exp(-Math.pow(hueGap(h,130)/50,2));}
function satFor(h){return 100-22*Math.exp(-Math.pow(hueGap(h,150)/60,2));}
function setAccent(h){
  if(Math.abs(h-accentHue)&lt;.05)return;
  accentHue=h;
  const root=document.documentElement.style,h2=(h+22)%360;
  root.setProperty('--orange','hsl('+h.toFixed(1)+','+satFor(h).toFixed(1)+'%,'+lightFor(h).toFixed(1)+'%)');
  root.setProperty('--yellow','hsl('+h2.toFixed(1)+','+(satFor(h2)-4).toFixed(1)+'%,'+(lightFor(h2)+2).toFixed(1)+'%)');
}
function patFrame(now){
  patRaf=0;
  if(document.hidden||!patSeen){patLast=0;return;}
  if(!patLast)patLast=now;
  const moving=stepPattern(now);
  setAccent(cur.hue);
  adaptQuality(now-patLast);
  patLast=now;
  drawPattern(now);
  if(moving||!calm())patRaf=requestAnimationFrame(patFrame);
  else patLast=0;
}
function startPattern(){if(!patRaf)patRaf=requestAnimationFrame(patFrame);}
function savePattern(){
  if(RO)return;
  if(cloud.on){scheduleSave();return;}
  clearTimeout(patSaveTimer);
  patSaveTimer=setTimeout(()=>{try{localStorage.setItem('imz-pattern',JSON.stringify(pat));}catch(e){}},400);
}
/* how: 'instant' | 'tween' (glide from where it is) | 'intro' (bloom open) */
function setPattern(o,how){
  const next=normPattern(o);
  pat=next;
  if(how==='instant'||calm()){
    tween=null;
    PSPEC.forEach(sp=>{cur[sp[0]]=pat[sp[0]];syncControl(sp,cur[sp[0]]);});
  }else{
    const from=how==='intro'?{count:3,scale:.28,twist:0,hue:next.hue}:Object.assign({},cur);
    tween={from:from,to:Object.assign({},next),t0:performance.now(),dur:how==='intro'?2400:1500,fn:ease.inOutCubic};
  }
  startPattern();
}
function buildPatternControls(){
  const box=$('patControls');
  PSPEC.forEach(sp=>{
    const k=sp[0],id='pat-'+k;
    const out=el('output',{for:id},'');
    const inp=el('input',{type:'range',id:id,class:'rng',min:sp[2],max:sp[3],step:sp[4],'aria-label':sp[1]});
    inp.addEventListener('input',()=>{
      pat[k]=Number(inp.value);
      if(tween){tween=null;PSPEC.forEach(q=>syncControl(q,pat[q[0]]));}   /* grabbing a slider mid-glide hands control back */
      syncControl(sp,pat[k]);
      startPattern();savePattern();
    });
    patIn[k]=inp;patOut[k]=out;
    box.append(el('div',{class:'pctl'},el('div',{class:'top'},el('label',{for:id},sp[1]),out),inp));
  });
  $('patRandom').onclick=()=>{
    const o={};
    PSPEC.forEach(sp=>{
      const steps=Math.round((sp[3]-sp[2])/sp[4]);
      o[sp[0]]=sp[2]+Math.round(Math.random()*steps)*sp[4];
    });
    setPattern(o,'tween');savePattern();
  };
  $('patReset').onclick=()=>{setPattern(null,'tween');savePattern();};
  if(window.IntersectionObserver)new IntersectionObserver(es=>{patSeen=es[es.length-1].isIntersecting;if(patSeen)startPattern();}).observe($('patCanvas'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)startPattern();});
  setPattern(null,'instant');
}
function initPattern(){
  let src=null;
  if(cloud.on)src=cloud.meta;
  else{
    if(!RO){try{const t=localStorage.getItem('imz-pattern');if(t)src=JSON.parse(t);}catch(e){}}
    if(!src&amp;&amp;embedded&amp;&amp;embedded.pattern)src=embedded.pattern;
  }
  setPattern(src,'intro');
}

/* ---------- sharing (owner side) ---------- */
const NB=['todo','deadlines','consumed','diary'];
function sharedDay(d,nb){
  const o={};
  if(nb.todo)o.todos=d.todos.map(t=>({id:t.id,text:t.text,done:t.done}));
  if(nb.deadlines)o.deadlines=d.deadlines.map(t=>({id:t.id,text:t.text,done:t.done}));
  if(nb.consumed){o.consumed={};CATS.forEach(c=>{o.consumed[c[0]]=d.consumed[c[0]].map(e=>({id:e.id,text:e.text}));});}
  if(nb.diary)o.diary=d.diary;
  return o;
}
function sharedHas(o){
  return !!((o.todos&amp;&amp;o.todos.length)||(o.deadlines&amp;&amp;o.deadlines.length)||(o.consumed&amp;&amp;CATS.some(c=>o.consumed[c[0]].length))||(o.diary&amp;&amp;o.diary.trim()));
}
function buildSharedDays(){
  const days={};
  for(const k of Object.keys(state.days)){
    if(!KEYRE.test(k))continue;
    const o=sharedDay(state.days[k],shareNb);
    if(sharedHas(o))days[k]=o;
  }
  return days;
}
function canon(v){
  return JSON.stringify(v,(key,val)=>{
    if(val&amp;&amp;typeof val==='object'&amp;&amp;!Array.isArray(val)){const o={};Object.keys(val).sort().forEach(k=>{o[k]=val[k];});return o;}
    return val;
  });
}
/* the page republishes itself: its own source is kept in #imz-tpl, with two placeholders */
function encodeTpl(t){return t.replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;');}
function decodeTpl(t){return t.replace(/&amp;lt;/g,'&lt;').replace(/&amp;amp;/g,'&amp;');}
function buildHtml(data){
  const tpl=decodeTpl($('imz-tpl').textContent);
  const json=JSON.stringify(data).replace(/&lt;/g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return tpl.replace(/%%(TPL|DATA)%%/g,(m,w)=>w==='TPL'?encodeTpl(tpl):json);
}
function loadEmbedded(){
  try{embedded=JSON.parse($('imz-data').textContent);}catch(e){embedded=null;}
  if(!embedded||typeof embedded!=='object')embedded={enabled:false,nb:{},days:{},updated:''};
  if(embedded.nb&amp;&amp;typeof embedded.nb==='object')NB.forEach(k=>{if(typeof embedded.nb[k]==='boolean')shareNb[k]=embedded.nb[k];});
}
function setShareStatus(t){shareStatusText=t;const n=$('shareStatus');if(n)n.textContent=t;}
function statusText(){
  if(!(embedded&amp;&amp;embedded.enabled))return 'Not shared yet.';
  const same=canon(embedded.nb||{})===canon(shareNb)&amp;&amp;canon(embedded.days||{})===canon(buildSharedDays())&amp;&amp;canon(normPattern(embedded.pattern))===canon(pat);
  let when='';
  if(embedded.updated){const d=new Date(embedded.updated);if(!isNaN(d))when=' Last updated '+d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'.';}
  return (same?'Up to date.':"You have changes that aren't shared yet.")+when;
}
async function publishShared(enable){
  setShareStatus('Updating…');
  let art=null;
  try{art=(window.claude&amp;&amp;window.claude.use)?await within(window.claude.use('artifact'),5000):null;}catch(e){}
  if(!art){setShareStatus("Updating the shared page isn't available here.");return;}
  const local=Object.keys(state.days).filter(hasData);
  if(enable&amp;&amp;!local.length&amp;&amp;embedded&amp;&amp;Object.keys(embedded.days||{}).length){
    setShareStatus('This device has no notes, so the shared page was left as it is.');return;
  }
  const data={v:1,enabled:!!enable,nb:{todo:!!shareNb.todo,deadlines:!!shareNb.deadlines,consumed:!!shareNb.consumed,diary:!!shareNb.diary},updated:new Date().toISOString(),days:enable?buildSharedDays():{},pattern:normPattern(pat)};
  let html;
  try{html=buildHtml(data);}catch(e){setShareStatus("Couldn't prepare the shared page.");return;}
  try{
    await persist();
    try{sessionStorage.setItem('imz-flash',enable?'Shared page updated.':'Sharing is off.');}catch(e){}
    await art.publish(html);
  }catch(e){
    try{sessionStorage.removeItem('imz-flash');}catch(x){}
    const c=e&amp;&amp;e.code;
    setShareStatus(
      c==='conflict'?'The page changed elsewhere. Reload and try again.':
      (c==='not_writer'||c==='not_granted')?'Only the owner can update the shared page.':
      c==='too_large'?'The shared copy is too large.':
      c==='rate_limited'?'Too many updates. Try again in a minute.':
      (c==='capability_disabled'||c==='not_declared'||c==='capability_removed')?"Updating the shared page isn't available here.":
      "Couldn't update the shared page.");
  }
}
function renderShare(){
  const p=$('sharePanel');
  const on=!!(embedded&amp;&amp;embedded.enabled);
  const labels={todo:'To-dos',deadlines:'Deadlines',consumed:'Consumed',diary:'Diary'};
  const grp=el('div',{class:'chkgrp'});
  NB.forEach(id=>{
    const i=el('input',{type:'checkbox'});
    i.checked=!!shareNb[id];
    i.onchange=()=>{shareNb[id]=i.checked;setShareStatus(statusText());};
    grp.append(el('label',{class:'chk'},i,el('span',null,labels[id])));
  });
  const upd=el('button',{type:'button',class:'btn'},on?'Update shared page':'Start sharing');
  upd.onclick=()=>publishShared(true);
  const bar=el('div',{class:'shbar'},upd);
  if(on){const stop=el('button',{type:'button',class:'btn quiet'},'Stop sharing');stop.onclick=()=>publishShared(false);bar.append(stop);}
  bar.append(el('span',{id:'shareStatus',class:'note'},shareStatusText||statusText()));
  p.replaceChildren(
    el('h2',null,'Share with friends'),
    el('p',{class:'note'},'Anyone with the link can view a read-only copy of your calendar. They don\u2019t need to sign in to Claude. Link sharing has to be turned on for this page.'),
    grp,
    el('p',{class:'note'},'Photos are never shared. Whatever is ticked above can be read by everyone with the link. The shared copy only changes when you press the button below.'),
    bar
  );
}
$('shareBtn').onclick=()=>{
  const p=$('sharePanel');
  if(p.hidden){shareStatusText='';renderShare();p.hidden=false;}else p.hidden=true;
};
document.addEventListener('click',e=>{
  const p=$('sharePanel');
  if(p.hidden||!document.contains(e.target))return;
  if(!e.target.closest('#sharePanel')&amp;&amp;!e.target.closest('#shareBtn'))p.hidden=true;
});

/* ---------- read-only view (friends) ---------- */
function renderAll(){refreshGrid();renderDeadlines();if(view.open)renderPop();}
function startViewer(){
  viewSettings={enabled:!!embedded.enabled,nb:embedded.nb||{}};
  const days={};
  Object.keys(embedded.days||{}).forEach(k=>{if(KEYRE.test(k))days[k]=normDay(embedded.days[k]);});
  state={days:days};
  renderAll();
}

/* ---------- mode and start ---------- */
function within(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function detectMode(){
  if(location.hash==='#edit')return 'local';
  let owner=false;
  if(window.claude&amp;&amp;window.claude.use){
    try{
      const user=await within(window.claude.use('user'),5000);
      owner=user?!!(await within(user.isOwner(),3000)):false;
    }catch(e){}
  }
  if(owner)return 'owner';
  return (embedded&amp;&amp;embedded.enabled)?'viewer':'local';
}
/* size the rows so all 31 days fit on screen without scrolling */
function fitRows(){
  const phone=mobileMQ.matches;
  let avail;
  if(phone){
    const top=gridScroll.getBoundingClientRect().top+window.scrollY;
    avail=innerHeight-top-40-20;
  }else avail=gridScroll.clientWidth?gridScroll.clientHeight-40-34:0;
  const lo=phone?18:14;
  const byH=Math.floor(avail/31*10)/10;
  const byW=phone?46:Math.floor(((gridScroll.clientWidth-34)/(12*1.08))*10)/10;   /* never wider than its six columns */
  const row=Math.max(lo,Math.min(46,byH,byW));
  document.documentElement.style.setProperty('--row',row+'px');
}
function applyHeader(){
  $('roBadge').hidden=!RO;
  $('importBtn').hidden=RO||mode===null;
  $('exportBtn').hidden=RO||!downloads;
  const sb=$('shareBtn');
  sb.hidden=mode!=='owner';
  sb.textContent=(embedded&amp;&amp;embedded.enabled)?'Sharing on':'Share';
  fitRows();
}
function centerToday(){
  const dot=dotFor(today);
  if(dot){const t=centerTarget(dot);gridScroll.scrollTo({left:t.tx,top:t.ty,behavior:'auto'});}
}

pop.addEventListener('focusout',()=>setTimeout(()=>{
  if(cloud.rerender&amp;&amp;!pop.contains(document.activeElement)){cloud.rerender=false;renderAll();}
},0));

/* ---------- start ---------- */
loadEmbedded();
buildPatternControls();
buildGrid();refreshGrid();renderDeadlines();fitRows();
(async()=>{
  mode=await detectMode();
  RO=mode==='viewer';
  applyHeader();
  if(RO){initPattern();centerToday();startViewer();return;}
  const synced=mode==='owner'?await startCloud():false;
  document.documentElement.dataset.sync=synced?'1':'0';
  if(!synced){
    await store.init();
    let migrate=false;
    try{
      const raw=await store.get();
      if(raw){
        state=normState(raw);
        migrate=!!(raw.days&amp;&amp;Object.keys(raw.days).some(k=>raw.days[k]&amp;&amp;Array.isArray(raw.days[k].todos)&amp;&amp;raw.days[k].todos.some(t=>t&amp;&amp;t.deadline)));
      }
    }catch(e){}
    loaded=true;
    if(migrate)scheduleSave();
  }
  initPattern();
  refreshGrid();renderDeadlines();
  centerToday();
  if(mode==='owner'){
    try{const f=sessionStorage.getItem('imz-flash');if(f){sessionStorage.removeItem('imz-flash');toast(f,3500);}}catch(e){}
  }
  if(!synced){
    if(store.kind==='memory')toast("Saving isn't available here, so notes will be lost when you close the page. Use Export backup to keep a copy.",8000);
    else if(mode==='local'&amp;&amp;window.claude&amp;&amp;!Object.keys(state.days).length)toast('Nothing is shared on this page yet.',6000);
  }else toast('Your notes sync across your devices.',3000);
})();
if(window.claude&amp;&amp;window.claude.use){
  window.claude.use('downloads').then(d=>{if(d){downloads=d;applyHeader();}}).catch(()=>{});
}
})();
&lt;/script>
&lt;/body>
&lt;/html>
</script>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS=[
  ['audio','Audio','Podcast, song, album'],
  ['text','Text','Book, article, essay'],
  ['food','Food','Meal, snack, drink'],
  ['media','Media','Film, show, video']
];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const dim=(y,m)=>new Date(y,m,0).getDate();
const parseKey=k=>{const p=k.split('-').map(Number);return{y:p[0],m:p[1],d:p[2]};};
const dateOf=k=>{const p=parseKey(k);return new Date(p.y,p.m-1,p.d);};
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const KEYRE=/^\d{4}-\d{2}-\d{2}$/;
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobileMQ=window.matchMedia('(max-width: 960px)');
const sheetMQ=window.matchMedia('(max-width: 1180px)');   /* below this width the notes open as a bottom sheet */
const noHover=window.matchMedia('(hover: none)');

function todayKey(){const n=new Date();return keyOf(n.getFullYear(),n.getMonth()+1,n.getDate());}
function fmtLong(k){return dateOf(k).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtTip(k){return dateOf(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}
function fmtHit(k){return dateOf(k).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function fmtGroup(k){const y=parseKey(k).y;return dateOf(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:y!==parseKey(today).y?'numeric':undefined});}
function daysFromToday(k){const a=parseKey(k),t=parseKey(today);return Math.round((Date.UTC(a.y,a.m-1,a.d)-Date.UTC(t.y,t.m-1,t.d))/864e5);}
function relLabel(k){const n=daysFromToday(k);return n===0?'Today':n===1?'Tomorrow':'In '+n+' days';}

function el(tag,attrs){
  const n=document.createElement(tag);
  if(attrs)for(const k of Object.keys(attrs)){
    const v=attrs[k];
    if(v===false||v==null)continue;
    if(k==='class')n.className=v;
    else if(k==='value')n.value=v;
    else n.setAttribute(k,v===true?'':String(v));
  }
  for(let i=2;i<arguments.length;i++)n.append(arguments[i]);
  return n;
}

/* ---------- state ---------- */
let today=todayKey();
let state={days:{}};
let loaded=false;
const view={year:parseKey(today).y,open:null,tab:'todo'};
let RO=false,mode=null,viewSettings=null,downloads=null,embedded=null;
const shareNb={todo:true,deadlines:true,consumed:true,diary:false};
let shareStatusText='';

function emptyDay(){
  return{todos:[],deadlines:[],consumed:{audio:[],text:[],food:[],media:[]},diary:'',dPhotos:[],cPhotos:[]};
}
function day(k,create){
  let d=state.days[k];
  if(!d&&create)d=state.days[k]=emptyDay();
  return d||null;
}
function dayHas(d){
  return !!d&&!!(d.todos.length||d.deadlines.length||d.diary.trim()||CATS.some(c=>d.consumed[c[0]].length)||d.dPhotos.length||d.cPhotos.length);
}
function hasData(k){return dayHas(state.days[k]);}
function prune(){for(const k of Object.keys(state.days))if(!hasData(k))delete state.days[k];}

function normPhotos(a){
  return Array.isArray(a)?a.filter(p=>p&&typeof p.src==='string'&&p.src.indexOf('data:image/')===0).map(p=>({id:typeof p.id==='string'&&p.id?p.id:uid(),src:p.src})):[];
}
function normDay(v){
  v=v||{};
  const id=x=>typeof x==='string'&&x?x:uid();
  const out=emptyDay();
  out.todos=(Array.isArray(v.todos)?v.todos:[]).filter(t=>t&&typeof t.text==='string').map(t=>({id:id(t.id),text:t.text,deadline:KEYRE.test(t.deadline||'')?t.deadline:'',done:!!t.done}));
  out.deadlines=(Array.isArray(v.deadlines)?v.deadlines:[]).filter(t=>t&&typeof t.text==='string').map(t=>({id:id(t.id),text:t.text,done:!!t.done}));
  CATS.forEach(c=>{
    const src=v.consumed&&Array.isArray(v.consumed[c[0]])?v.consumed[c[0]]:[];
    out.consumed[c[0]]=src.filter(e=>e&&typeof e.text==='string').map(e=>({id:id(e.id),text:e.text}));
  });
  out.diary=typeof v.diary==='string'?v.diary:'';
  out.dPhotos=normPhotos(v.dPhotos);
  out.cPhotos=normPhotos(v.cPhotos);
  return out;
}
function normState(raw){
  const out={days:{}};
  if(raw&&raw.days&&typeof raw.days==='object'){
    for(const k of Object.keys(raw.days))if(KEYRE.test(k))out.days[k]=normDay(raw.days[k]);
  }
  /* older versions kept deadlines on to-dos: move them to the deadline's own day */
  for(const k of Object.keys(out.days)){
    const keep=[];
    out.days[k].todos.forEach(t=>{
      if(t.deadline){
        const tgt=out.days[t.deadline]||(out.days[t.deadline]=emptyDay());
        tgt.deadlines.push({id:t.id,text:t.text,done:t.done});
      }else keep.push({id:t.id,text:t.text,done:t.done});
    });
    out.days[k].todos=keep;
  }
  return out;
}
function mergeDay(a,b){
  const addNew=(la,ib)=>{const s=new Set(la.map(x=>x.id));ib.forEach(x=>{if(!s.has(x.id))la.push(x);});};
  addNew(a.todos,b.todos);
  addNew(a.deadlines,b.deadlines);
  CATS.forEach(c=>addNew(a.consumed[c[0]],b.consumed[c[0]]));
  addNew(a.dPhotos,b.dPhotos);
  addNew(a.cPhotos,b.cPhotos);
  if(b.diary&&a.diary.indexOf(b.diary)<0)a.diary=a.diary?a.diary+'\n\n'+b.diary:b.diary;
}

/* ---------- storage (IndexedDB, then localStorage, then memory) ---------- */
const store={
  kind:'memory',db:null,
  async init(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('imz-calender',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>rej(r.error);
        r.onblocked=()=>rej(new Error('blocked'));
      });
      this.kind='idb';return;
    }catch(e){}
    try{localStorage.setItem('__imz','1');localStorage.removeItem('__imz');this.kind='ls';}
    catch(e){this.kind='memory';}
  },
  async get(){
    if(this.kind==='idb')return new Promise((res,rej)=>{const r=this.db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    if(this.kind==='ls'){const s=localStorage.getItem('imz-calender-state');return s?JSON.parse(s):null;}
    return null;
  },
  async put(v){
    if(this.kind==='idb')return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
    if(this.kind==='ls'){localStorage.setItem('imz-calender-state',JSON.stringify(v));return;}
  }
};
/* ---------- your synced notes (owner only; the same on every device you sign in on) ---------- */
/* one document per day under data/users/<you>/, photos as their own documents under their day,
   and a small meta document for the pattern. Only you can write there; nobody else can read it. */
const cloud={on:false,col:null,uid:null,saved:new Map(),photos:new Set(),meta:null,
  writing:false,again:false,deferred:null,rerender:false,migrating:false};
const PHOTO_MAX=200000,DOC_MAX=240000;
const cloudPhoto=(k,id)=>cloud.col.doc(k).collection('photos').doc(id);
function dayStored(d){return {todos:d.todos,deadlines:d.deadlines,consumed:d.consumed,diary:d.diary,dPhotos:d.dPhotos.map(p=>p.id),cPhotos:d.cPhotos.map(p=>p.id)};}
function fromStored(v,prev){
  const base=normDay({todos:v.todos,deadlines:v.deadlines,consumed:v.consumed,diary:v.diary,dPhotos:[],cPhotos:[]});
  const old=new Map([...(prev?prev.dPhotos:[]),...(prev?prev.cPhotos:[])].map(p=>[p.id,p.src]));
  const ids=a=>(Array.isArray(a)?a:[]).filter(x=>typeof x==='string').map(id=>({id:id,src:old.get(id)}));
  base.dPhotos=ids(v.dPhotos);base.cPhotos=ids(v.cPhotos);
  return base;
}
function cloudForget(k){[...cloud.photos].forEach(key=>{if(key.indexOf(k+'/')===0)cloud.photos.delete(key);});}
async function fetchPhoto(k,id){const s=await cloudPhoto(k,id).get();return s.exists?s.data().src:null;}

/* writes only what changed since the last successful save; photos go first so no day points at a missing photo */
async function cloudPersist(){
  if(cloud.writing){cloud.again=true;return;}
  cloud.writing=true;
  let failed=0,tooBig=false;
  const run=async jobs=>{
    for(let i=0;i<jobs.length;i+=4){
      const res=await Promise.allSettled(jobs.slice(i,i+4).map(f=>f()));
      failed+=res.filter(r=>r.status==='rejected').length;
    }
  };
  try{
    const want=new Map();
    Object.keys(state.days).forEach(k=>{
      const d=state.days[k];if(!dayHas(d))return;
      [...d.dPhotos,...d.cPhotos].forEach(p=>want.set(k+'/'+p.id,{k:k,p:p}));
    });
    const photoJobs=[];
    want.forEach((v,key)=>{
      if(cloud.photos.has(key)||!v.p.src)return;
      photoJobs.push(async()=>{await cloudPhoto(v.k,v.p.id).set({src:v.p.src});cloud.photos.add(key);});
    });
    [...cloud.photos].forEach(key=>{
      if(want.has(key))return;
      photoJobs.push(async()=>{const i=key.indexOf('/');await cloudPhoto(key.slice(0,i),key.slice(i+1)).delete();cloud.photos.delete(key);});
    });
    await run(photoJobs);

    const dayJobs=[];
    const keys=new Set([...Object.keys(state.days),...[...cloud.saved.keys()].filter(k=>k!=='meta')]);
    keys.forEach(k=>{
      const d=state.days[k],has=!!d&&dayHas(d);
      const c=has?canon(dayStored(d)):null;
      if(c===(cloud.saved.has(k)?cloud.saved.get(k):null))return;
      if(has&&c.length>DOC_MAX){tooBig=true;return;}
      dayJobs.push(async()=>{
        if(has){await cloud.col.doc(k).set(JSON.parse(c));cloud.saved.set(k,c);}
        else{await cloud.col.doc(k).delete();cloud.saved.delete(k);}
      });
    });
    const mc=canon({pattern:normPattern(pat)});
    if(mc!==cloud.saved.get('meta'))dayJobs.push(async()=>{await cloud.col.doc('meta').set(JSON.parse(mc));cloud.saved.set('meta',mc);});
    await run(dayJobs);

    if(tooBig)toast("One day's notes are too long to sync. Shorten the longest diary entry.",6000);
    if(failed){
      toast("Couldn't sync just now. Your notes are safe on this device and will retry.",5000);
      dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(persist,6000);
    }else if(cloud.migrating){
      cloud.migrating=false;
      try{localStorage.setItem('imz-moved-'+cloud.uid,'1');}catch(e){}
    }
  }finally{
    cloud.writing=false;
    if(cloud.again){cloud.again=false;scheduleSave();}
    if(cloud.deferred&&!dirty)cloudApply(cloud.deferred);
  }
}
/* other devices' changes arrive here; while you're typing or a save is pending, they wait */
function cloudApply(snap){
  if(dirty||cloud.writing){cloud.deferred=snap;return;}
  cloud.deferred=null;
  let changed=false,meta;
  const remote=new Map();
  snap.docs.forEach(d=>{if(d.id==='meta')meta=d.data();else if(KEYRE.test(d.id))remote.set(d.id,d.data()||{});});
  new Set([...remote.keys(),...Object.keys(state.days)]).forEach(k=>{
    if(remote.has(k)){
      const nd=fromStored(remote.get(k),state.days[k]);
      const c=canon(dayStored(nd));
      if(c===cloud.saved.get(k))return;
      cloud.saved.set(k,c);cloudForget(k);
      [...nd.dPhotos,...nd.cPhotos].forEach(p=>cloud.photos.add(k+'/'+p.id));
      state.days[k]=nd;changed=true;
    }else if(cloud.saved.has(k)){
      cloud.saved.delete(k);cloudForget(k);delete state.days[k];changed=true;
    }
  });
  if(meta!==undefined){
    const next=normPattern(meta&&meta.pattern),pc=canon({pattern:next});
    if(pc!==cloud.saved.get('meta')){cloud.saved.set('meta',pc);cloud.meta=next;setPattern(next,'tween');}
  }
  if(changed){
    if(view.open&&pop.contains(document.activeElement))cloud.rerender=true;
    else renderAll();
  }
}
/* signs in to the synced copy; returns false (and the device keeps working locally) if it can't */
async function startCloud(){
  let db=null,uid=null;
  try{
    db=await within(window.claude.use('db'),6000);
    const user=await within(window.claude.use('user'),6000);
    uid=user?await within(user.id(),4000):null;
  }catch(e){}
  if(!db||!uid)return false;
  const col=db.collection('data/users/'+uid);
  let snap=null;
  try{snap=await within(col.get(),10000);}catch(e){}
  if(!snap){toast("Couldn't reach your synced notes. Showing this device's copy.",6000);return false;}
  cloud.col=col;cloud.uid=uid;
  state={days:{}};
  snap.docs.forEach(d=>{
    if(d.id==='meta'){const next=normPattern((d.data()||{}).pattern);cloud.meta=next;cloud.saved.set('meta',canon({pattern:next}));return;}
    if(!KEYRE.test(d.id))return;
    const nd=fromStored(d.data()||{},null);
    state.days[d.id]=nd;
    cloud.saved.set(d.id,canon(dayStored(nd)));
    [...nd.dPhotos,...nd.cPhotos].forEach(p=>cloud.photos.add(d.id+'/'+p.id));
  });
  /* this device's older local notes are merged in once, then never again */
  let moved=false;try{moved=!!localStorage.getItem('imz-moved-'+uid);}catch(e){}
  if(!moved){
    let local=null;
    try{await store.init();const raw=await store.get();if(raw)local=normState(raw);}catch(e){}
    if(local&&Object.keys(local.days).some(k=>dayHas(local.days[k]))){
      Object.keys(local.days).forEach(k=>{
        const ld=local.days[k];if(!dayHas(ld))return;
        if(state.days[k])mergeDay(state.days[k],ld);else state.days[k]=ld;
      });
      cloud.migrating=true;
    }else{try{localStorage.setItem('imz-moved-'+uid,'1');}catch(e){}}
  }
  cloud.on=true;loaded=true;
  if(cloud.migrating)scheduleSave();
  col.onSnapshot(cloudApply,()=>toast("Lost the connection to your synced notes. Changes will sync when it's back.",6000));
  return true;
}

let saveTimer=null,dirty=false;
function scheduleSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);}
async function persist(){
  clearTimeout(saveTimer);
  if(RO||!loaded||!dirty)return;
  dirty=false;
  prune();
  if(cloud.on){await cloudPersist();return;}
  try{await store.put(state);}
  catch(e){toast('Could not save. Storage may be full. Export a backup to keep your notes.',6000);}
}

/* photos */
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
async function shrink(file){
  const src=await readFile(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=src;});
  const encode=(scale,q)=>{
    const c=document.createElement('canvas');
    const f=Math.min(1,1280/Math.max(img.width,img.height))*scale;
    c.width=Math.max(1,Math.round(img.width*f));c.height=Math.max(1,Math.round(img.height*f));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  };
  for(const scale of [1,.75,.6])for(const q of [.82,.72,.62,.52]){
    const out=encode(scale,q);
    if(out.length<=PHOTO_MAX)return out;
  }
  throw new Error('too large');
}

/* ---------- search ---------- */
const qEl=$('q'),resEl=$('results');
let searchTimer=null;
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function snippet(text,tokens){
  const max=170,l=text.toLowerCase();
  let first=Infinity;tokens.forEach(t=>{const i=l.indexOf(t);if(i>=0)first=Math.min(first,i);});
  const start=text.length>max?Math.max(0,(first===Infinity?0:first)-50):0;
  const s=text.slice(start,start+max).replace(/\s+/g,' ');
  const frag=document.createDocumentFragment();
  if(start>0)frag.append('…');
  const re=new RegExp('('+tokens.map(escRe).join('|')+')','gi');
  s.split(re).forEach((part,i)=>{if(!part)return;if(i%2)frag.append(el('mark',null,part));else frag.append(part);});
  if(start+max<text.length)frag.append('…');
  return frag;
}
function runSearch(){
  const q=qEl.value.trim().toLowerCase();
  if(!q){resEl.hidden=true;return;}
  const tokens=q.split(/\s+/).filter(Boolean);
  const test=txt=>{const l=txt.toLowerCase();return tokens.every(t=>l.indexOf(t)>=0);};
  const hits=[];
  for(const k of Object.keys(state.days)){
    const d=state.days[k];
    d.todos.forEach(t=>{if(test(t.text))hits.push({k:k,tab:'todo',label:'To-do',text:t.text});});
    d.deadlines.forEach(t=>{if(test(t.text))hits.push({k:k,tab:'deadlines',label:'Deadline',text:t.text});});
    CATS.forEach(c=>d.consumed[c[0]].forEach(e=>{if(test(e.text))hits.push({k:k,tab:'consumed',label:c[1],text:e.text});}));
    if(d.diary&&test(d.diary))hits.push({k:k,tab:'diary',label:'Diary',text:d.diary});
  }
  hits.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
  resEl.replaceChildren();
  if(!hits.length)resEl.append(el('div',{class:'meta'},'No matches.'));
  else{
    resEl.append(el('div',{class:'meta'},hits.length+(hits.length===1?' match':' matches')));
    hits.slice(0,60).forEach(h=>{
      const b=el('button',{type:'button',class:'hit'},
        el('span',{class:'when'},fmtHit(h.k),el('b',null,h.label)),
        el('span',{class:'what'}));
      b.querySelector('.what').append(snippet(h.text,tokens));
      b.onclick=()=>{resEl.hidden=true;openDay(h.k,h.tab==='deadlines'?undefined:h.tab);};
      resEl.append(b);
    });
    if(hits.length>60)resEl.append(el('div',{class:'meta'},'Showing the 60 most recent. Add more words to narrow it down.'));
  }
  resEl.hidden=false;
}
qEl.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,90);});
qEl.addEventListener('focus',()=>{if(qEl.value.trim())runSearch();});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))resEl.hidden=true;});

/* ---------- header controls ---------- */
function setYear(y){
  view.year=y;view.open=null;pop.hidden=true;document.body.classList.remove('pop-open');hideTip();
  buildGrid();refreshGrid();
}
$('prevYear').onclick=()=>setYear(view.year-1);
$('nextYear').onclick=()=>setYear(view.year+1);
$('todayBtn').onclick=()=>openDay(today,'todo');

$('exportBtn').onclick=async()=>{
  if(!downloads)return;
  prune();
  const data=JSON.stringify({app:'imz-calender',version:1,exportedAt:new Date().toISOString(),days:state.days});
  try{await downloads.save({filename:'imz-calender-backup-'+today+'.json',data:data});toast('Backup saved.');}
  catch(e){if(e&&e.code==='declined')return;toast("The backup couldn't be saved.");}
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async()=>{
  const f=$('importFile').files[0];$('importFile').value='';
  if(!f)return;
  try{
    const raw=JSON.parse(await f.text());
    if(!raw||typeof raw!=='object'||!raw.days)throw new Error('shape');
    const inc=normState(raw);let n=0;
    for(const k of Object.keys(inc.days)){
      if(!dayHas(inc.days[k]))continue;
      if(state.days[k])mergeDay(state.days[k],inc.days[k]);else state.days[k]=inc.days[k];
      n++;
    }
    mutated('*');if(view.open)renderPop();
    toast('Imported '+n+(n===1?' day.':' days.'));
  }catch(e){toast("That file isn't an Imz Calender backup.",4000);}
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('lb').hidden){$('lb').hidden=true;return;}
    if(!$('sharePanel').hidden){$('sharePanel').hidden=true;return;}
    if(!resEl.hidden){resEl.hidden=true;return;}
    if(view.open){closePop();return;}
  }
  if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'')){e.preventDefault();qEl.focus();}
});

/* ---------- date rollover ---------- */
function checkToday(){
  const t=todayKey();
  if(t!==today){today=t;refreshGrid();renderDeadlines();}
}
setInterval(checkToday,60000);
addEventListener('focus',checkToday);
addEventListener('resize',()=>{fitRows();startPattern();});

/* ---------- pattern maker (nested circles, canvas) ---------- */
const TAU=Math.PI*2;
const PSPEC=[
  ['count','Petals',3,7,0.1,v=>v.toFixed(1)],
  ['scale','Bloom',0.28,0.55,0.005,v=>Math.round(v*100)+'%'],
  ['twist','Twist',0,120,0.5,v=>Math.round(v)+'\u00b0'],
  ['hue','Hue',0,360,1,v=>Math.round(v)+'\u00b0']
];
const PDEF={count:5,scale:0.4,twist:24,hue:28};
/* easing curves: t and the result both run from 0 to 1 */
const ease={
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5)
};
function normPattern(o){
  const out={};
  PSPEC.forEach(sp=>{
    const v=(o&&typeof o==='object')?Number(o[sp[0]]):NaN;
    out[sp[0]]=isFinite(v)?Math.min(sp[3],Math.max(sp[2],v)):PDEF[sp[0]];
  });
  return out;
}
let pat=normPattern(null);          /* where the sliders point (saved and published) */
const cur=Object.assign({},PDEF);   /* what is drawn right now, easing toward pat */
const patIn={},patOut={};
let tween=null,patRaf=0,patLast=0,patSeen=true,patSaveTimer=null;
let quality=1,frameEma=16.7,frameCount=0;
const calm=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function syncControl(sp,v){
  const k=sp[0];
  patIn[k].value=v;
  patOut[k].textContent=sp[5](v);
  patIn[k].style.setProperty('--p',((v-sp[2])/(sp[3]-sp[2])*100)+'%');
  if(k==='hue')patIn[k].style.setProperty('--c','hsl('+Math.round(v)+',95%,58%)');
}
function stepPattern(now){
  const dt=Math.min(.05,Math.max(0,(now-patLast)/1000));
  let moving=false;
  if(tween){
    const t=Math.min(1,(now-tween.t0)/tween.dur),e=tween.fn(t);
    PSPEC.forEach(sp=>{
      const k=sp[0];
      cur[k]=tween.from[k]+(tween.to[k]-tween.from[k])*e;
      syncControl(sp,cur[k]);
    });
    if(t>=1)tween=null;
    moving=true;
  }else{
    /* frame-rate independent glide toward the slider values */
    const a=1-Math.exp(-dt/.16);
    PSPEC.forEach(sp=>{
      const k=sp[0],d=pat[k]-cur[k];
      if(Math.abs(d)>(sp[3]-sp[2])*2e-4){cur[k]+=d*a;moving=true;}
      else cur[k]=pat[k];
    });
  }
  return moving;
}
function drawPattern(now){
  const c=$('patCanvas');
  const dpr=Math.min(2,window.devicePixelRatio||1)*quality;
  const w=Math.round(c.clientWidth*dpr);
  if(!w)return;
  if(c.width!==w||c.height!==w){c.width=w;c.height=w;}
  const g=c.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,w,w);
  g.globalCompositeOperation='lighter';
  const still=calm(),t=still?0:now/1000;
  const scale=cur.scale+(still?0:Math.sin(t*.45)*.012);
  const count=cur.count,step=TAU/count,twist=cur.twist*Math.PI/180;
  const DEPTH=4,cols=[],dens=Math.min(1,5.2/count);   /* more petals overlap more, so soften them */
  for(let d=0;d<=DEPTH;d++)cols.push('hsl('+(((cur.hue+d*9)%360+360)%360)+',92%,'+(60+d*3)+'%)');
  const ring=(cx,cy,r,d,ang,a)=>{
    if(a<.01)return;
    g.globalAlpha=a*(.75-d*.11)*dens;
    g.lineWidth=(1.15-d*.15)*dpr;
    g.strokeStyle=cols[d];
    g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();
    if(d>=DEPTH)return;
    const cr=r*scale,dist=r-cr,n=Math.ceil(count-1e-6);
    for(let i=0;i<n;i++){
      const aa=ang+i*step;
      /* a fractional petal fades in, so changing the count never pops */
      ring(cx+Math.cos(aa)*dist,cy+Math.sin(aa)*dist,cr,d+1,ang+twist,a*Math.min(1,count-i));
    }
  };
  ring(w/2,w/2,w/2-3*dpr,0,t*.05,1);
  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
}
/* if frames run slow, draw at a slightly lower resolution; creep back up when there is headroom */
function adaptQuality(ms){
  frameEma=frameEma*.92+Math.min(100,ms)*.08;
  if(++frameCount%30)return;
  if(frameEma>24&&quality>.55)quality=Math.max(.55,quality-.15);
  else if(frameEma<17.5&&quality<1)quality=Math.min(1,quality+.05);
}
/* the calendar's accent colors follow the Hue slider (today sits a little warmer than the rest) */
let accentHue=-1;
const hueGap=(h,c)=>(((h-c+180)%360)+360)%360-180;
/* even out how bright each hue feels: blues a touch lighter, greens a touch softer */
function lightFor(h){return 50+13*Math.exp(-Math.pow(hueGap(h,245)/45,2))-6*Math.exp(-Math.pow(hueGap(h,130)/50,2));}
function satFor(h){return 100-22*Math.exp(-Math.pow(hueGap(h,150)/60,2));}
function setAccent(h){
  if(Math.abs(h-accentHue)<.05)return;
  accentHue=h;
  const root=document.documentElement.style,h2=(h+22)%360;
  root.setProperty('--orange','hsl('+h.toFixed(1)+','+satFor(h).toFixed(1)+'%,'+lightFor(h).toFixed(1)+'%)');
  root.setProperty('--yellow','hsl('+h2.toFixed(1)+','+(satFor(h2)-4).toFixed(1)+'%,'+(lightFor(h2)+2).toFixed(1)+'%)');
}
function patFrame(now){
  patRaf=0;
  if(document.hidden||!patSeen){patLast=0;return;}
  if(!patLast)patLast=now;
  const moving=stepPattern(now);
  setAccent(cur.hue);
  adaptQuality(now-patLast);
  patLast=now;
  drawPattern(now);
  if(moving||!calm())patRaf=requestAnimationFrame(patFrame);
  else patLast=0;
}
function startPattern(){if(!patRaf)patRaf=requestAnimationFrame(patFrame);}
function savePattern(){
  if(RO)return;
  if(cloud.on){scheduleSave();return;}
  clearTimeout(patSaveTimer);
  patSaveTimer=setTimeout(()=>{try{localStorage.setItem('imz-pattern',JSON.stringify(pat));}catch(e){}},400);
}
/* how: 'instant' | 'tween' (glide from where it is) | 'intro' (bloom open) */
function setPattern(o,how){
  const next=normPattern(o);
  pat=next;
  if(how==='instant'||calm()){
    tween=null;
    PSPEC.forEach(sp=>{cur[sp[0]]=pat[sp[0]];syncControl(sp,cur[sp[0]]);});
  }else{
    const from=how==='intro'?{count:3,scale:.28,twist:0,hue:next.hue}:Object.assign({},cur);
    tween={from:from,to:Object.assign({},next),t0:performance.now(),dur:how==='intro'?2400:1500,fn:ease.inOutCubic};
  }
  startPattern();
}
function buildPatternControls(){
  const box=$('patControls');
  PSPEC.forEach(sp=>{
    const k=sp[0],id='pat-'+k;
    const out=el('output',{for:id},'');
    const inp=el('input',{type:'range',id:id,class:'rng',min:sp[2],max:sp[3],step:sp[4],'aria-label':sp[1]});
    inp.addEventListener('input',()=>{
      pat[k]=Number(inp.value);
      if(tween){tween=null;PSPEC.forEach(q=>syncControl(q,pat[q[0]]));}   /* grabbing a slider mid-glide hands control back */
      syncControl(sp,pat[k]);
      startPattern();savePattern();
    });
    patIn[k]=inp;patOut[k]=out;
    box.append(el('div',{class:'pctl'},el('div',{class:'top'},el('label',{for:id},sp[1]),out),inp));
  });
  $('patRandom').onclick=()=>{
    const o={};
    PSPEC.forEach(sp=>{
      const steps=Math.round((sp[3]-sp[2])/sp[4]);
      o[sp[0]]=sp[2]+Math.round(Math.random()*steps)*sp[4];
    });
    setPattern(o,'tween');savePattern();
  };
  $('patReset').onclick=()=>{setPattern(null,'tween');savePattern();};
  if(window.IntersectionObserver)new IntersectionObserver(es=>{patSeen=es[es.length-1].isIntersecting;if(patSeen)startPattern();}).observe($('patCanvas'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)startPattern();});
  setPattern(null,'instant');
}
function initPattern(){
  let src=null;
  if(cloud.on)src=cloud.meta;
  else{
    if(!RO){try{const t=localStorage.getItem('imz-pattern');if(t)src=JSON.parse(t);}catch(e){}}
    if(!src&&embedded&&embedded.pattern)src=embedded.pattern;
  }
  setPattern(src,'intro');
}

/* ---------- sharing (owner side) ---------- */
const NB=['todo','deadlines','consumed','diary'];
function sharedDay(d,nb){
  const o={};
  if(nb.todo)o.todos=d.todos.map(t=>({id:t.id,text:t.text,done:t.done}));
  if(nb.deadlines)o.deadlines=d.deadlines.map(t=>({id:t.id,text:t.text,done:t.done}));
  if(nb.consumed){o.consumed={};CATS.forEach(c=>{o.consumed[c[0]]=d.consumed[c[0]].map(e=>({id:e.id,text:e.text}));});}
  if(nb.diary)o.diary=d.diary;
  return o;
}
function sharedHas(o){
  return !!((o.todos&&o.todos.length)||(o.deadlines&&o.deadlines.length)||(o.consumed&&CATS.some(c=>o.consumed[c[0]].length))||(o.diary&&o.diary.trim()));
}
function buildSharedDays(){
  const days={};
  for(const k of Object.keys(state.days)){
    if(!KEYRE.test(k))continue;
    const o=sharedDay(state.days[k],shareNb);
    if(sharedHas(o))days[k]=o;
  }
  return days;
}
function canon(v){
  return JSON.stringify(v,(key,val)=>{
    if(val&&typeof val==='object'&&!Array.isArray(val)){const o={};Object.keys(val).sort().forEach(k=>{o[k]=val[k];});return o;}
    return val;
  });
}
/* the page republishes itself: its own source is kept in #imz-tpl, with two placeholders */
function encodeTpl(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function decodeTpl(t){return t.replace(/&lt;/g,'<').replace(/&amp;/g,'&');}
function buildHtml(data){
  const tpl=decodeTpl($('imz-tpl').textContent);
  const json=JSON.stringify(data).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return tpl.replace(/%%(TPL|DATA)%%/g,(m,w)=>w==='TPL'?encodeTpl(tpl):json);
}
function loadEmbedded(){
  try{embedded=JSON.parse($('imz-data').textContent);}catch(e){embedded=null;}
  if(!embedded||typeof embedded!=='object')embedded={enabled:false,nb:{},days:{},updated:''};
  if(embedded.nb&&typeof embedded.nb==='object')NB.forEach(k=>{if(typeof embedded.nb[k]==='boolean')shareNb[k]=embedded.nb[k];});
}
function setShareStatus(t){shareStatusText=t;const n=$('shareStatus');if(n)n.textContent=t;}
function statusText(){
  if(!(embedded&&embedded.enabled))return 'Not shared yet.';
  const same=canon(embedded.nb||{})===canon(shareNb)&&canon(embedded.days||{})===canon(buildSharedDays())&&canon(normPattern(embedded.pattern))===canon(pat);
  let when='';
  if(embedded.updated){const d=new Date(embedded.updated);if(!isNaN(d))when=' Last updated '+d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'.';}
  return (same?'Up to date.':"You have changes that aren't shared yet.")+when;
}
async function publishShared(enable){
  setShareStatus('Updating…');
  let art=null;
  try{art=(window.claude&&window.claude.use)?await within(window.claude.use('artifact'),5000):null;}catch(e){}
  if(!art){setShareStatus("Updating the shared page isn't available here.");return;}
  const local=Object.keys(state.days).filter(hasData);
  if(enable&&!local.length&&embedded&&Object.keys(embedded.days||{}).length){
    setShareStatus('This device has no notes, so the shared page was left as it is.');return;
  }
  const data={v:1,enabled:!!enable,nb:{todo:!!shareNb.todo,deadlines:!!shareNb.deadlines,consumed:!!shareNb.consumed,diary:!!shareNb.diary},updated:new Date().toISOString(),days:enable?buildSharedDays():{},pattern:normPattern(pat)};
  let html;
  try{html=buildHtml(data);}catch(e){setShareStatus("Couldn't prepare the shared page.");return;}
  try{
    await persist();
    try{sessionStorage.setItem('imz-flash',enable?'Shared page updated.':'Sharing is off.');}catch(e){}
    await art.publish(html);
  }catch(e){
    try{sessionStorage.removeItem('imz-flash');}catch(x){}
    const c=e&&e.code;
    setShareStatus(
      c==='conflict'?'The page changed elsewhere. Reload and try again.':
      (c==='not_writer'||c==='not_granted')?'Only the owner can update the shared page.':
      c==='too_large'?'The shared copy is too large.':
      c==='rate_limited'?'Too many updates. Try again in a minute.':
      (c==='capability_disabled'||c==='not_declared'||c==='capability_removed')?"Updating the shared page isn't available here.":
      "Couldn't update the shared page.");
  }
}
function renderShare(){
  const p=$('sharePanel');
  const on=!!(embedded&&embedded.enabled);
  const labels={todo:'To-dos',deadlines:'Deadlines',consumed:'Consumed',diary:'Diary'};
  const grp=el('div',{class:'chkgrp'});
  NB.forEach(id=>{
    const i=el('input',{type:'checkbox'});
    i.checked=!!shareNb[id];
    i.onchange=()=>{shareNb[id]=i.checked;setShareStatus(statusText());};
    grp.append(el('label',{class:'chk'},i,el('span',null,labels[id])));
  });
  const upd=el('button',{type:'button',class:'btn'},on?'Update shared page':'Start sharing');
  upd.onclick=()=>publishShared(true);
  const bar=el('div',{class:'shbar'},upd);
  if(on){const stop=el('button',{type:'button',class:'btn quiet'},'Stop sharing');stop.onclick=()=>publishShared(false);bar.append(stop);}
  bar.append(el('span',{id:'shareStatus',class:'note'},shareStatusText||statusText()));
  p.replaceChildren(
    el('h2',null,'Share with friends'),
    el('p',{class:'note'},'Anyone with the link can view a read-only copy of your calendar. They don\u2019t need to sign in to Claude. Link sharing has to be turned on for this page.'),
    grp,
    el('p',{class:'note'},'Photos are never shared. Whatever is ticked above can be read by everyone with the link. The shared copy only changes when you press the button below.'),
    bar
  );
}
$('shareBtn').onclick=()=>{
  const p=$('sharePanel');
  if(p.hidden){shareStatusText='';renderShare();p.hidden=false;}else p.hidden=true;
};
document.addEventListener('click',e=>{
  const p=$('sharePanel');
  if(p.hidden||!document.contains(e.target))return;
  if(!e.target.closest('#sharePanel')&&!e.target.closest('#shareBtn'))p.hidden=true;
});

/* ---------- read-only view (friends) ---------- */
function renderAll(){refreshGrid();renderDeadlines();if(view.open)renderPop();}
function startViewer(){
  viewSettings={enabled:!!embedded.enabled,nb:embedded.nb||{}};
  const days={};
  Object.keys(embedded.days||{}).forEach(k=>{if(KEYRE.test(k))days[k]=normDay(embedded.days[k]);});
  state={days:days};
  renderAll();
}

/* ---------- mode and start ---------- */
function within(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function detectMode(){
  if(location.hash==='#edit')return 'local';
  let owner=false;
  if(window.claude&&window.claude.use){
    try{
      const user=await within(window.claude.use('user'),5000);
      owner=user?!!(await within(user.isOwner(),3000)):false;
    }catch(e){}
  }
  if(owner)return 'owner';
  return (embedded&&embedded.enabled)?'viewer':'local';
}
/* size the rows so all 31 days fit on screen without scrolling */
function fitRows(){
  const phone=mobileMQ.matches;
  let avail;
  if(phone){
    const top=gridScroll.getBoundingClientRect().top+window.scrollY;
    avail=innerHeight-top-40-20;
  }else avail=gridScroll.clientWidth?gridScroll.clientHeight-40-34:0;
  const lo=phone?18:14;
  const byH=Math.floor(avail/31*10)/10;
  const byW=phone?46:Math.floor(((gridScroll.clientWidth-34)/(12*1.08))*10)/10;   /* never wider than its six columns */
  const row=Math.max(lo,Math.min(46,byH,byW));
  document.documentElement.style.setProperty('--row',row+'px');
}
function applyHeader(){
  $('roBadge').hidden=!RO;
  $('importBtn').hidden=RO||mode===null;
  $('exportBtn').hidden=RO||!downloads;
  const sb=$('shareBtn');
  sb.hidden=mode!=='owner';
  sb.textContent=(embedded&&embedded.enabled)?'Sharing on':'Share';
  fitRows();
}
function centerToday(){
  const dot=dotFor(today);
  if(dot){const t=centerTarget(dot);gridScroll.scrollTo({left:t.tx,top:t.ty,behavior:'auto'});}
}

pop.addEventListener('focusout',()=>setTimeout(()=>{
  if(cloud.rerender&&!pop.contains(document.activeElement)){cloud.rerender=false;renderAll();}
},0));

/* ---------- start ---------- */
loadEmbedded();
buildPatternControls();
buildGrid();refreshGrid();renderDeadlines();fitRows();
(async()=>{
  mode=await detectMode();
  RO=mode==='viewer';
  applyHeader();
  if(RO){initPattern();centerToday();startViewer();return;}
  const synced=mode==='owner'?await startCloud():false;
  document.documentElement.dataset.sync=synced?'1':'0';
  if(!synced){
    await store.init();
    let migrate=false;
    try{
      const raw=await store.get();
      if(raw){
        state=normState(raw);
        migrate=!!(raw.days&&Object.keys(raw.days).some(k=>raw.days[k]&&Array.isArray(raw.days[k].todos)&&raw.days[k].todos.some(t=>t&&t.deadline)));
      }
    }catch(e){}
    loaded=true;
    if(migrate)scheduleSave();
  }
  initPattern();
  refreshGrid();renderDeadlines();
  centerToday();
  if(mode==='owner'){
    try{const f=sessionStorage.getItem('imz-flash');if(f){sessionStorage.removeItem('imz-flash');toast(f,3500);}}catch(e){}
  }
  if(!synced){
    if(store.kind==='memory')toast("Saving isn't available here, so notes will be lost when you close the page. Use Export backup to keep a copy.",8000);
    else if(mode==='local'&&window.claude&&!Object.keys(state.days).length)toast('Nothing is shared on this page yet.',6000);
  }else toast('Your notes sync across your devices.',3000);
})();
if(window.claude&&window.claude.use){
  window.claude.use('downloads').then(d=>{if(d){downloads=d;applyHeader();}}).catch(()=>{});
}
})();
</script>
