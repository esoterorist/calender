<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imz Calender</title>
<style>
:root{
  box-sizing:border-box;
  color-scheme:dark;
  --bg:#000; --fg:#fff; --dim:#8f8f8f; --line:#2a2a2a; --panel:#141414;
  --orange:#ff7a00; --yellow:#ffd60a;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --row:clamp(26px,calc((100vh - 150px) / 31),42px);
  --d:calc(var(--row) * .76);
  --col:max(26px,calc(var(--row) * 1.08));
  --ease:cubic-bezier(.22,.9,.2,1);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.serif{font-family:var(--serif)}
.vh{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}

/* header */
header{flex:none;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center;height:72px;padding:0 32px}
.brandrow{grid-column:1 / span 3;display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:18px;font-weight:500;letter-spacing:-.01em}
.year{grid-column:4 / span 6;justify-self:center;position:relative;display:flex;align-items:center;gap:8px;font-size:18px;font-variant-numeric:tabular-nums}
.year #todayBtn{position:absolute;left:calc(100% + 24px);font-size:14px;line-height:1.4;padding:0;white-space:nowrap}
.year button{color:var(--dim);font-size:22px;line-height:1;padding:2px 8px}
.year button:hover{color:var(--fg)}
.link{color:var(--dim)}
.link:hover{color:var(--fg)}
.spacer{flex:1}
.search{grid-column:10 / span 3;position:relative}
.search input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 0;color:var(--fg);border-radius:0}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--fg);outline:none}
#results{position:absolute;top:calc(100% + 10px);right:0;width:min(460px,calc(100vw - 64px));max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:40;padding:6px}
#results .meta{padding:8px 10px;color:var(--dim);font-size:12px}
.hit{display:grid;grid-template-columns:96px 1fr;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:6px}
.hit:hover,.hit:focus-visible{background:#1f1f1f}
.hit .when{font-size:12px;color:var(--dim)}
.hit .when b{display:block;font-weight:400;color:var(--orange);margin-top:2px}
.hit .what{font-family:var(--serif);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
mark{background:none;color:var(--yellow)}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:0 32px}
#gridScroll{grid-column:4 / span 6;min-width:0;min-height:0;overflow:auto}
#gridWrap{position:relative;padding:0 0 32px}
#grid{display:grid;width:max-content;margin:0 auto;grid-template-columns:34px repeat(12,var(--col));grid-template-rows:40px repeat(31,var(--row))}
.corner,.mh{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.corner{left:0;z-index:3}
.mh.now,.dl.now{color:var(--yellow);font-weight:700}
.dl{position:sticky;left:0;background:var(--bg);z-index:1;display:flex;align-items:center;justify-content:flex-start;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* day circles */
.dot{position:relative;width:100%;height:var(--row)}
.dot::before{content:"";position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);border-radius:50%;border:1.5px solid var(--orange);transition:transform .28s var(--ease)}
.dot.past::before{background:var(--orange)}
.dot.today::before{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 9px 1px color-mix(in srgb,var(--yellow) 60%,transparent)}
.dot.has::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--mark)}
.dot.past,.dot.today{--mark:#000}
.dot.future{--mark:var(--orange)}
.dot:hover::before{transform:scale(1.2)}
.dot.sel::before,.dot:focus-visible::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.dot:focus-visible{outline:none}

/* hover preview */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:260px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#tip .tt-date{font-size:12px;color:var(--dim);margin-bottom:6px}
#tip .tt-item{font-family:var(--serif);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
#tip .tt-item.done{color:var(--dim);text-decoration:line-through}
#tip .tt-empty,#tip .tt-more{font-size:12px;color:var(--dim)}

/* popover */
#pop{position:fixed;right:32px;bottom:calc(32px + env(safe-area-inset-bottom,0px));z-index:20;width:clamp(340px,calc((100vw - 328px) / 3 + 72px),520px);max-height:min(680px,calc(100vh - 110px));min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px 18px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#pop.in{animation:pop .36s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:none}}
.pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#popDate{font-size:15px;font-weight:500;line-height:1.3}
#popClose{color:var(--dim);font-size:22px;line-height:1;padding:0 2px}
#popClose:hover{color:var(--fg)}
.tabs{display:flex;gap:20px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 8px;color:var(--dim);border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--orange)}
.pop-body{margin:14px -20px 0;flex:1 1 300px;overflow-y:auto;min-height:0;padding:6px 20px 14px 46px;font-family:var(--serif);font-size:16px;line-height:28px;
  background-color:#101010;
  background-image:linear-gradient(to right,transparent 33px,color-mix(in srgb,var(--orange) 28%,transparent) 33px 34px,transparent 34px),repeating-linear-gradient(to bottom,transparent 0 27px,#222 27px 28px);
  background-attachment:local;background-position:0 6px}
.pop-body input[type=text],.pop-body textarea{height:28px;padding:0;line-height:28px;border-bottom:0}
.pop-body textarea{height:auto}
.pop-body input[type=text]:focus{box-shadow:inset 0 -1px 0 var(--orange)}
.pop-body textarea:focus{outline:none}
.pop-body h3{font:400 12px/28px var(--sans);color:var(--dim);margin:14px 0 0}
.pop-body h3:first-child{margin-top:0}
:is(.pop-body,.pop-dl) input[type=text],:is(.pop-body,.pop-dl) textarea{background:none;border:0;border-bottom:1px solid transparent;border-radius:0;color:var(--fg);font-family:var(--serif);font-size:16px;line-height:1.5;width:100%;min-width:0;padding:4px 0}
:is(.pop-body,.pop-dl) input[type=text]:focus,:is(.pop-body,.pop-dl) textarea:focus{outline:none;border-bottom-color:var(--orange)}
:is(.pop-body,.pop-dl) input::placeholder,:is(.pop-body,.pop-dl) textarea::placeholder{color:#666}
.pop-body .add,.pop-dl .add{border-bottom-color:var(--line)!important}
.pop-dl{flex:none;height:156px;margin-top:14px;padding:12px 0 6px;border-top:1px solid var(--line);overflow-y:auto;font-family:var(--serif);font-size:16px;line-height:1.5}
.pop-dl h3{font:400 12px/1.3 var(--sans);color:var(--dim);margin:0 0 6px}
.pop-dl .addrow{margin:0 0 6px}
.addrow{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.row.over .txt{color:var(--yellow)}
#tip .tt-sub{margin-top:8px}
.chip{font:12px var(--sans);color:var(--dim);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip.set{color:var(--fg)}
.chip.over{color:var(--yellow)}
.btn{font:13px var(--sans);color:var(--orange)}
.btn:hover{color:var(--yellow)}
.row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;padding:5px 0;position:relative}
.row.simple{grid-template-columns:1fr auto}
.row .x{opacity:0}
.row:hover .chip,.row:hover .x,.row:focus-within .chip,.row:focus-within .x{opacity:1}
.x{color:var(--dim);font:18px/1 var(--sans);padding:0 2px}
.x:hover{color:var(--fg)}
.cb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--orange);transition:background .25s var(--ease)}
.cb[aria-checked="true"]{background:var(--orange)}
.row.done .txt{color:var(--dim);text-decoration:line-through}
.bul{margin:0 0 16px;padding-left:20px}
.bul li{margin:2px 0}
.dia{display:block;resize:none;min-height:260px;overflow:hidden;line-height:28px;padding:0}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block}
.ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;font-size:15px;opacity:0;padding:0}
.ph:hover .x,.ph:focus-within .x{opacity:1}

/* deadlines */
aside{grid-column:10 / span 3;min-height:0;overflow:auto;padding:0 0 32px}
aside h2{font-size:14px;font-weight:500;margin:0;height:40px;display:flex;align-items:center}
.dgroup{margin:20px 0 4px;font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:baseline}
.dgroup:first-of-type{margin-top:0}
.dgroup .rel.today{color:var(--yellow)}
.drow{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:5px 0}
.drow .cb{margin-top:3px}
.dtxt{text-align:left;font-family:var(--serif);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.dtxt:hover{color:var(--orange)}
.empty{color:var(--dim);font-size:13px;line-height:1.5;margin:0}

/* pattern maker */
#patternPanel{grid-column:1 / span 3;min-height:0;overflow:auto;padding:0 0 32px;display:flex;flex-direction:column}
#patternPanel h2{font-size:14px;font-weight:500;margin:0;height:40px;display:flex;align-items:center}
.utils{margin-top:auto;padding-top:28px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12px}
#patCanvas{display:block;width:100%;max-width:340px;aspect-ratio:1 / 1}
.pctl{margin-top:20px;max-width:340px}
.pctl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:2px}
.pctl output{font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:.01em}
.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
.rng:focus-visible{outline:none}
.rng::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(to right,var(--orange) var(--p,50%),#2c2c2c var(--p,50%))}
.rng::-moz-range-track{height:2px;border-radius:2px;background:#2c2c2c}
.rng::-moz-range-progress{height:2px;border-radius:2px;background:var(--orange)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--c,var(--orange));border:0;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--c,var(--orange));border:0;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.rng:hover::-webkit-slider-thumb{transform:scale(1.18)}
.rng:hover::-moz-range-thumb{transform:scale(1.18)}
.rng:active::-webkit-slider-thumb{transform:scale(1.35);box-shadow:0 0 0 7px rgba(255,255,255,.07)}
.rng:active::-moz-range-thumb{transform:scale(1.35);box-shadow:0 0 0 7px rgba(255,255,255,.07)}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.rng:focus-visible::-moz-range-thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.patbar{display:flex;gap:20px;margin-top:26px}
.link,.btn,.chip,.x,#popClose,.tabs button,.dtxt{transition:color .25s var(--ease),border-color .25s var(--ease)}

/* sharing and read-only */
.badge{color:var(--dim);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
#sharePanel{position:fixed;left:32px;bottom:76px;width:min(340px,calc(100vw - 64px));z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#sharePanel h2{font-size:15px;font-weight:500;margin:0 0 8px}
.note{margin:0 0 12px;color:var(--dim);font-size:12px;line-height:1.5}
.chkgrp{margin:4px 0 10px}
.chk{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.chk input{accent-color:var(--orange);width:16px;height:16px;margin:0}
.shbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.btn.quiet{color:var(--dim)}
.btn.quiet:hover{color:var(--fg)}
.shbar .note{flex:1 1 100%;margin:4px 0 0}
.cb.on{background:var(--orange)}
span.cb{display:block;margin-top:3px}
.txt-ro{padding:4px 0;overflow-wrap:anywhere}
.row.ro.done .txt-ro{color:var(--dim);text-decoration:line-through}
.ro-line{padding:4px 0;overflow-wrap:anywhere}
.ro-diary{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ro-empty{color:var(--dim);font:13px var(--sans);padding:4px 0}

/* overlays */
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:grid;place-items:center;cursor:zoom-out}
#lb img{max-width:92vw;max-height:92vh;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:#1c1c1c;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

@media (hover:none){
  .row .chip,.row .x,.ph .x{opacity:1!important}
}
@media (max-width:960px){
  body{overflow:auto}
  header{display:flex;flex-wrap:wrap;gap:12px 24px;height:auto;padding:14px 18px}
  .brandrow{flex:none}
  .year{flex:none}
  .search{flex:1 1 100%}
  main{display:flex;flex-direction:column;flex:none;min-height:auto;padding:0}
  #gridScroll{flex:none;height:auto;overflow:visible;order:1}
  #gridWrap{padding:0 12px 16px}
  #grid{width:100%;margin:0;grid-template-columns:24px repeat(12,minmax(0,1fr))}
  .corner,.mh,.dl{position:static}
  aside{flex:none;padding:8px 18px 40px;order:2;overflow:visible}
  #patternPanel{flex:none;order:3;padding:8px 18px 40px;overflow:visible}
  #sharePanel{left:12px;right:12px;bottom:12px;width:auto}
}
@media (max-width:1180px){
  #pop{position:fixed;left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:70vh;border-radius:14px 14px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform-origin:50% 100%!important}
  body.pop-open #gridWrap{padding-bottom:70vh}
}
@media (prefers-reduced-motion:reduce){
  #pop.in{animation:none}
  .dot::before{transition:none}
}
</style>

<header>

      </div>

  <aside aria-label="Upcoming deadlines">
    <h2>Deadlines</h2>
    <div id="dl"></div>
  </aside>
</main>

  box-sizing:border-box;
  color-scheme:dark;
  --bg:#000; --fg:#fff; --dim:#8f8f8f; --line:#2a2a2a; --panel:#141414;
  --orange:#ff7a00; --yellow:#ffd60a;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --row:clamp(26px,calc((100vh - 150px) / 31),42px);
  --d:calc(var(--row) * .76);
  --col:max(26px,calc(var(--row) * 1.08));
  --ease:cubic-bezier(.22,.9,.2,1);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.serif{font-family:var(--serif)}
.vh{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}

/* header */
header{flex:none;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center;height:72px;padding:0 32px}
.brandrow{grid-column:1 / span 3;display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:18px;font-weight:500;letter-spacing:-.01em}
.year{grid-column:4 / span 6;justify-self:center;position:relative;display:flex;align-items:center;gap:8px;font-size:18px;font-variant-numeric:tabular-nums}
.year #todayBtn{position:absolute;left:calc(100% + 24px);font-size:14px;line-height:1.4;padding:0;white-space:nowrap}
.year button{color:var(--dim);font-size:22px;line-height:1;padding:2px 8px}
.year button:hover{color:var(--fg)}
.link{color:var(--dim)}
.link:hover{color:var(--fg)}
.spacer{flex:1}
.search{grid-column:10 / span 3;position:relative}
.search input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 0;color:var(--fg);border-radius:0}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--fg);outline:none}
#results{position:absolute;top:calc(100% + 10px);right:0;width:min(460px,calc(100vw - 64px));max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:40;padding:6px}
#results .meta{padding:8px 10px;color:var(--dim);font-size:12px}
.hit{display:grid;grid-template-columns:96px 1fr;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:6px}
.hit:hover,.hit:focus-visible{background:#1f1f1f}
.hit .when{font-size:12px;color:var(--dim)}
.hit .when b{display:block;font-weight:400;color:var(--orange);margin-top:2px}
.hit .what{font-family:var(--serif);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
mark{background:none;color:var(--yellow)}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:0 32px}
#gridScroll{grid-column:4 / span 6;min-width:0;min-height:0;overflow:auto}
#gridWrap{position:relative;padding:0 0 32px}
#grid{display:grid;width:max-content;margin:0 auto;grid-template-columns:34px repeat(12,var(--col));grid-template-rows:40px repeat(31,var(--row))}
.corner,.mh{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.corner{left:0;z-index:3}
.mh.now,.dl.now{color:var(--yellow);font-weight:700}
.dl{position:sticky;left:0;background:var(--bg);z-index:1;display:flex;align-items:center;justify-content:flex-start;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* day circles */
.dot{position:relative;width:100%;height:var(--row)}
.dot::before{content:"";position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);border-radius:50%;border:1.5px solid var(--orange);transition:transform .28s var(--ease)}
.dot.past::before{background:var(--orange)}
.dot.today::before{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 9px 1px color-mix(in srgb,var(--yellow) 60%,transparent)}
.dot.has::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--mark)}
.dot.past,.dot.today{--mark:#000}
.dot.future{--mark:var(--orange)}
.dot:hover::before{transform:scale(1.2)}
.dot.sel::before,.dot:focus-visible::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.dot:focus-visible{outline:none}

/* hover preview */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:260px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#tip .tt-date{font-size:12px;color:var(--dim);margin-bottom:6px}
#tip .tt-item{font-family:var(--serif);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
#tip .tt-item.done{color:var(--dim);text-decoration:line-through}
#tip .tt-empty,#tip .tt-more{font-size:12px;color:var(--dim)}

/* popover */
#pop{position:fixed;right:32px;bottom:calc(32px + env(safe-area-inset-bottom,0px));z-index:20;width:clamp(340px,calc((100vw - 328px) / 3 + 72px),520px);max-height:min(680px,calc(100vh - 110px));min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px 18px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#pop.in{animation:pop .36s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:none}}
.pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#popDate{font-size:15px;font-weight:500;line-height:1.3}
#popClose{color:var(--dim);font-size:22px;line-height:1;padding:0 2px}
#popClose:hover{color:var(--fg)}
.tabs{display:flex;gap:20px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 8px;color:var(--dim);border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--orange)}
.pop-body{margin:14px -20px 0;flex:1 1 300px;overflow-y:auto;min-height:0;padding:6px 20px 14px 46px;font-family:var(--serif);font-size:16px;line-height:28px;
  background-color:#101010;
  background-image:linear-gradient(to right,transparent 33px,color-mix(in srgb,var(--orange) 28%,transparent) 33px 34px,transparent 34px),repeating-linear-gradient(to bottom,transparent 0 27px,#222 27px 28px);
  background-attachment:local;background-position:0 6px}
.pop-body input[type=text],.pop-body textarea{height:28px;padding:0;line-height:28px;border-bottom:0}
.pop-body textarea{height:auto}
.pop-body input[type=text]:focus{box-shadow:inset 0 -1px 0 var(--orange)}
.pop-body textarea:focus{outline:none}
.pop-body h3{font:400 12px/28px var(--sans);color:var(--dim);margin:14px 0 0}
.pop-body h3:first-child{margin-top:0}
:is(.pop-body,.pop-dl) input[type=text],:is(.pop-body,.pop-dl) textarea{background:none;border:0;border-bottom:1px solid transparent;border-radius:0;color:var(--fg);font-family:var(--serif);font-size:16px;line-height:1.5;width:100%;min-width:0;padding:4px 0}
:is(.pop-body,.pop-dl) input[type=text]:focus,:is(.pop-body,.pop-dl) textarea:focus{outline:none;border-bottom-color:var(--orange)}
:is(.pop-body,.pop-dl) input::placeholder,:is(.pop-body,.pop-dl) textarea::placeholder{color:#666}
.pop-body .add,.pop-dl .add{border-bottom-color:var(--line)!important}
.pop-dl{flex:none;height:156px;margin-top:14px;padding:12px 0 6px;border-top:1px solid var(--line);overflow-y:auto;font-family:var(--serif);font-size:16px;line-height:1.5}
.pop-dl h3{font:400 12px/1.3 var(--sans);color:var(--dim);margin:0 0 6px}
.pop-dl .addrow{margin:0 0 6px}
.addrow{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.row.over .txt{color:var(--yellow)}
#tip .tt-sub{margin-top:8px}
.chip{font:12px var(--sans);color:var(--dim);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip.set{color:var(--fg)}
.chip.over{color:var(--yellow)}
.btn{font:13px var(--sans);color:var(--orange)}
.btn:hover{color:var(--yellow)}
.row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;padding:5px 0;position:relative}
.row.simple{grid-template-columns:1fr auto}
.row .x{opacity:0}
.row:hover .chip,.row:hover .x,.row:focus-within .chip,.row:focus-within .x{opacity:1}
.x{color:var(--dim);font:18px/1 var(--sans);padding:0 2px}
.x:hover{color:var(--fg)}
.cb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--orange);transition:background .25s var(--ease)}
.cb[aria-checked="true"]{background:var(--orange)}
.row.done .txt{color:var(--dim);text-decoration:line-through}
.bul{margin:0 0 16px;padding-left:20px}
.bul li{margin:2px 0}
.dia{display:block;resize:none;min-height:260px;overflow:hidden;line-height:28px;padding:0}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block}
.ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;font-size:15px;opacity:0;padding:0}
.ph:hover .x,.ph:focus-within .x{opacity:1}

/* deadlines */
aside{grid-column:10 / span 3;min-height:0;overflow:auto;padding:0 0 32px}
aside h2{font-size:14px;font-weight:500;margin:0;height:40px;display:flex;align-items:center}
.dgroup{margin:20px 0 4px;font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:baseline}
.dgroup:first-of-type{margin-top:0}
.dgroup .rel.today{color:var(--yellow)}
.drow{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:5px 0}
.drow .cb{margin-top:3px}
.dtxt{text-align:left;font-family:var(--serif);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.dtxt:hover{color:var(--orange)}
.empty{color:var(--dim);font-size:13px;line-height:1.5;margin:0}

/* pattern maker */
#patternPanel{grid-column:1 / span 3;min-height:0;overflow:auto;padding:0 0 32px;display:flex;flex-direction:column}
#patternPanel h2{font-size:14px;font-weight:500;margin:0;height:40px;display:flex;align-items:center}
.utils{margin-top:auto;padding-top:28px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12px}
#patCanvas{display:block;width:100%;max-width:340px;aspect-ratio:1 / 1}
.pctl{margin-top:20px;max-width:340px}
.pctl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:2px}
.pctl output{font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:.01em}
.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
.rng:focus-visible{outline:none}
.rng::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(to right,var(--orange) var(--p,50%),#2c2c2c var(--p,50%))}
.rng::-moz-range-track{height:2px;border-radius:2px;background:#2c2c2c}
.rng::-moz-range-progress{height:2px;border-radius:2px;background:var(--orange)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--c,var(--orange));border:0;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--c,var(--orange));border:0;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.rng:hover::-webkit-slider-thumb{transform:scale(1.18)}
.rng:hover::-moz-range-thumb{transform:scale(1.18)}
.rng:active::-webkit-slider-thumb{transform:scale(1.35);box-shadow:0 0 0 7px rgba(255,255,255,.07)}
.rng:active::-moz-range-thumb{transform:scale(1.35);box-shadow:0 0 0 7px rgba(255,255,255,.07)}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.rng:focus-visible::-moz-range-thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.patbar{display:flex;gap:20px;margin-top:26px}
.link,.btn,.chip,.x,#popClose,.tabs button,.dtxt{transition:color .25s var(--ease),border-color .25s var(--ease)}

/* sharing and read-only */
.badge{color:var(--dim);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
#sharePanel{position:fixed;left:32px;bottom:76px;width:min(340px,calc(100vw - 64px));z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#sharePanel h2{font-size:15px;font-weight:500;margin:0 0 8px}
.note{margin:0 0 12px;color:var(--dim);font-size:12px;line-height:1.5}
.chkgrp{margin:4px 0 10px}
.chk{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.chk input{accent-color:var(--orange);width:16px;height:16px;margin:0}
.shbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.btn.quiet{color:var(--dim)}
.btn.quiet:hover{color:var(--fg)}
.shbar .note{flex:1 1 100%;margin:4px 0 0}
.cb.on{background:var(--orange)}
span.cb{display:block;margin-top:3px}
.txt-ro{padding:4px 0;overflow-wrap:anywhere}
.row.ro.done .txt-ro{color:var(--dim);text-decoration:line-through}
.ro-line{padding:4px 0;overflow-wrap:anywhere}
.ro-diary{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ro-empty{color:var(--dim);font:13px var(--sans);padding:4px 0}

/* overlays */
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:grid;place-items:center;cursor:zoom-out}
#lb img{max-width:92vw;max-height:92vh;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:#1c1c1c;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

@media (hover:none){
  .row .chip,.row .x,.ph .x{opacity:1!important}
}
@media (max-width:960px){
  body{overflow:auto}
  header{display:flex;flex-wrap:wrap;gap:12px 24px;height:auto;padding:14px 18px}
  .brandrow{flex:none}
  .year{flex:none}
  .search{flex:1 1 100%}
  main{display:flex;flex-direction:column;flex:none;min-height:auto;padding:0}
  #gridScroll{flex:none;height:auto;overflow:visible;order:1}
  #gridWrap{padding:0 12px 16px}
  #grid{width:100%;margin:0;grid-template-columns:24px repeat(12,minmax(0,1fr))}
  .corner,.mh,.dl{position:static}
  aside{flex:none;padding:8px 18px 40px;order:2;overflow:visible}
  #patternPanel{flex:none;order:3;padding:8px 18px 40px;overflow:visible}
  #sharePanel{left:12px;right:12px;bottom:12px;width:auto}
}
@media (max-width:1180px){
  #pop{position:fixed;left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:70vh;border-radius:14px 14px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform-origin:50% 100%!important}
  body.pop-open #gridWrap{padding-bottom:70vh}
}
@media (prefers-reduced-motion:reduce){
  #pop.in{animation:none}
  .dot::before{transition:none}
}
&lt;/style>
&lt;/head>
&lt;body>
&lt;header>
  &lt;div class="brandrow">
    &lt;div class="brand">Imz Calender&lt;/div>
    &lt;span id="roBadge" class="badge" hidden>View only&lt;/span>
  &lt;/div>
  &lt;div class="year">
    &lt;button id="prevYear" type="button" aria-label="Previous year">‹&lt;/button>
    &lt;span id="yearLabel" aria-live="polite">&lt;/span>

    &lt;button id="todayBtn" class="link" type="button">Today&lt;/button>
  &lt;/div>
  &lt;div class="search">
    &lt;input id="q" type="search" placeholder="Search everything" autocomplete="off" aria-label="Search all notes">

&lt;/header>

&lt;main>
  &lt;section id="patternPanel" aria-label="Pattern maker">
    &lt;h2>Pattern&lt;/h2>

      &lt;button id="patRandom" class="btn" type="button">Randomize&lt;/button>
      &lt;button id="patReset" class="btn quiet" type="button">Reset&lt;/button>
    &lt;/div>
    &lt;div class="utils">
      &lt;button id="shareBtn" class="link" type="button" hidden>Share&lt;/button>
      &lt;button id="exportBtn" class="link" type="button" hidden>Export backup&lt;/button>
      &lt;button id="importBtn" class="link" type="button" hidden>Import backup&lt;/button>
      &lt;input id="importFile" class="vh" type="file" accept=".json,application/json" tabindex="-1" aria-hidden="true">
    &lt;/div>
  &lt;/section>
  &lt;section id="gridScroll" aria-label="Year calendar">
    &lt;div id="gridWrap">
      &lt;div id="grid">&lt;/div>
      &lt;div id="pop" role="dialog" aria-label="Day notes" hidden>
        &lt;div class="pop-head">
          &lt;div id="popDate">&lt;/div>
          &lt;button id="popClose" type="button" aria-label="Close">×&lt;/button>
        &lt;/div>
        &lt;div class="tabs" role="tablist">
          &lt;button type="button" role="tab" data-tab="todo">To-do&lt;/button>
          &lt;button type="button" role="tab" data-tab="consumed">Consumed&lt;/button>
          &lt;button type="button" role="tab" data-tab="diary">Diary&lt;/button>

      &lt;/div>

    &lt;h2>Deadlines&lt;/h2>
    &lt;div id="dl">&lt;/div>
  &lt;/aside>

&lt;div id="sharePanel" role="dialog" aria-label="Share" hidden>&lt;/div>
&lt;div id="tip" hidden>&lt;/div>
&lt;div id="lb" hidden>&lt;img alt="">&lt;/div>
&lt;div id="toast" role="status">&lt;/div>
&lt;script id="imz-data" type="application/json">%%DATA%%&lt;/script>
&lt;script id="imz-tpl" type="text/plain">%%TPL%%&lt;/script>

&lt;script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS=[
  ['audio','Audio','Podcast, song, album'],
  ['text','Text','Book, article, essay'],
  ['food','Food','Meal, snack, drink'],
  ['media','Media','Film, show, video']
];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const dim=(y,m)=>new Date(y,m,0).getDate();
const parseKey=k=>{const p=k.split('-').map(Number);return{y:p[0],m:p[1],d:p[2]};};
const dateOf=k=>{const p=parseKey(k);return new Date(p.y,p.m-1,p.d);};
const uid=()=>(window.crypto&amp;&amp;crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const KEYRE=/^\d{4}-\d{2}-\d{2}$/;
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobileMQ=window.matchMedia('(max-width: 960px)');
const sheetMQ=window.matchMedia('(max-width: 1180px)');   /* below this width the notes open as a bottom sheet */
const noHover=window.matchMedia('(hover: none)');

function todayKey(){const n=new Date();return keyOf(n.getFullYear(),n.getMonth()+1,n.getDate());}
function fmtLong(k){return dateOf(k).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtTip(k){return dateOf(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}
function fmtHit(k){return dateOf(k).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function fmtGroup(k){const y=parseKey(k).y;return dateOf(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:y!==parseKey(today).y?'numeric':undefined});}
function daysFromToday(k){const a=parseKey(k),t=parseKey(today);return Math.round((Date.UTC(a.y,a.m-1,a.d)-Date.UTC(t.y,t.m-1,t.d))/864e5);}
function relLabel(k){const n=daysFromToday(k);return n===0?'Today':n===1?'Tomorrow':'In '+n+' days';}

function el(tag,attrs){
  const n=document.createElement(tag);
  if(attrs)for(const k of Object.keys(attrs)){
    const v=attrs[k];
    if(v===false||v==null)continue;
    if(k==='class')n.className=v;
    else if(k==='value')n.value=v;
    else n.setAttribute(k,v===true?'':String(v));
  }
  for(let i=2;i&lt;arguments.length;i++)n.append(arguments[i]);
  return n;
}

let today=todayKey();
let state={days:{}};
let loaded=false;
const view={year:parseKey(today).y,open:null,tab:'todo'};
let RO=false,mode=null,viewSettings=null,downloads=null,embedded=null;

function emptyDay(){
  return{todos:[],deadlines:[],consumed:{audio:[],text:[],food:[],media:[]},diary:'',dPhotos:[],cPhotos:[]};
}
function day(k,create){
  let d=state.days[k];
  if(!d&amp;&amp;create)d=state.days[k]=emptyDay();
  return d||null;
}
function dayHas(d){
  return !!d&amp;&amp;!!(d.todos.length||d.deadlines.length||d.diary.trim()||CATS.some(c=>d.consumed[c[0]].length)||d.dPhotos.length||d.cPhotos.length);
}
function hasData(k){return dayHas(state.days[k]);}
function prune(){for(const k of Object.keys(state.days))if(!hasData(k))delete state.days[k];}

function normPhotos(a){
  return Array.isArray(a)?a.filter(p=>p&amp;&amp;typeof p.src==='string'&amp;&amp;p.src.indexOf('data:image/')===0).map(p=>({id:typeof p.id==='string'&amp;&amp;p.id?p.id:uid(),src:p.src})):[];
}
function normDay(v){
  v=v||{};
  const id=x=>typeof x==='string'&amp;&amp;x?x:uid();
  const out=emptyDay();
  out.todos=(Array.isArray(v.todos)?v.todos:[]).filter(t=>t&amp;&amp;typeof t.text==='string').map(t=>({id:id(t.id),text:t.text,deadline:KEYRE.test(t.deadline||'')?t.deadline:'',done:!!t.done}));
  out.deadlines=(Array.isArray(v.deadlines)?v.deadlines:[]).filter(t=>t&amp;&amp;typeof t.text==='string').map(t=>({id:id(t.id),text:t.text,done:!!t.done}));
  CATS.forEach(c=>{
    const src=v.consumed&amp;&amp;Array.isArray(v.consumed[c[0]])?v.consumed[c[0]]:[];
    out.consumed[c[0]]=src.filter(e=>e&amp;&amp;typeof e.text==='string').map(e=>({id:id(e.id),text:e.text}));
  });
  out.diary=typeof v.diary==='string'?v.diary:'';
  out.dPhotos=normPhotos(v.dPhotos);
  out.cPhotos=normPhotos(v.cPhotos);
  return out;
}
function normState(raw){
  const out={days:{}};
  if(raw&amp;&amp;raw.days&amp;&amp;typeof raw.days==='object'){
    for(const k of Object.keys(raw.days))if(KEYRE.test(k))out.days[k]=normDay(raw.days[k]);
  }
  /* older versions kept deadlines on to-dos: move them to the deadline's own day */
  for(const k of Object.keys(out.days)){
    const keep=[];
    out.days[k].todos.forEach(t=>{
      if(t.deadline){
        const tgt=out.days[t.deadline]||(out.days[t.deadline]=emptyDay());
        tgt.deadlines.push({id:t.id,text:t.text,done:t.done});
      }else keep.push({id:t.id,text:t.text,done:t.done});
    });
    out.days[k].todos=keep;
  }
  return out;
}
function mergeDay(a,b){
  const addNew=(la,ib)=>{const s=new Set(la.map(x=>x.id));ib.forEach(x=>{if(!s.has(x.id))la.push(x);});};
  addNew(a.todos,b.todos);
  addNew(a.deadlines,b.deadlines);
  CATS.forEach(c=>addNew(a.consumed[c[0]],b.consumed[c[0]]));
  addNew(a.dPhotos,b.dPhotos);
  addNew(a.cPhotos,b.cPhotos);
  if(b.diary&amp;&amp;a.diary.indexOf(b.diary)&lt;0)a.diary=a.diary?a.diary+'\n\n'+b.diary:b.diary;
}

/* ---------- storage (IndexedDB, then localStorage, then memory) ---------- */
const store={
  kind:'memory',db:null,
  async init(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('imz-calender',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>rej(r.error);
        r.onblocked=()=>rej(new Error('blocked'));
      });
      this.kind='idb';return;
    }catch(e){}
    try{localStorage.setItem('__imz','1');localStorage.removeItem('__imz');this.kind='ls';}
    catch(e){this.kind='memory';}
  },
  async get(){
    if(this.kind==='idb')return new Promise((res,rej)=>{const r=this.db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    if(this.kind==='ls'){const s=localStorage.getItem('imz-calender-state');return s?JSON.parse(s):null;}
    return null;
  },
  async put(v){
    if(this.kind==='idb')return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
    if(this.kind==='ls'){localStorage.setItem('imz-calender-state',JSON.stringify(v));return;}
  }
};
/* ---------- your synced notes (owner only; the same on every device you sign in on) ---------- */
/* one document per day under data/users/&lt;you>/, photos as their own documents under their day,
   and a small meta document for the pattern. Only you can write there; nobody else can read it. */
const cloud={on:false,col:null,uid:null,saved:new Map(),photos:new Set(),meta:null,
  writing:false,again:false,deferred:null,rerender:false,migrating:false};
const PHOTO_MAX=200000,DOC_MAX=240000;
const cloudPhoto=(k,id)=>cloud.col.doc(k).collection('photos').doc(id);
function dayStored(d){return {todos:d.todos,deadlines:d.deadlines,consumed:d.consumed,diary:d.diary,dPhotos:d.dPhotos.map(p=>p.id),cPhotos:d.cPhotos.map(p=>p.id)};}
function fromStored(v,prev){
  const base=normDay({todos:v.todos,deadlines:v.deadlines,consumed:v.consumed,diary:v.diary,dPhotos:[],cPhotos:[]});
  const old=new Map([...(prev?prev.dPhotos:[]),...(prev?prev.cPhotos:[])].map(p=>[p.id,p.src]));
  const ids=a=>(Array.isArray(a)?a:[]).filter(x=>typeof x==='string').map(id=>({id:id,src:old.get(id)}));
  base.dPhotos=ids(v.dPhotos);base.cPhotos=ids(v.cPhotos);
  return base;
}
function cloudForget(k){[...cloud.photos].forEach(key=>{if(key.indexOf(k+'/')===0)cloud.photos.delete(key);});}
async function fetchPhoto(k,id){const s=await cloudPhoto(k,id).get();return s.exists?s.data().src:null;}

/* writes only what changed since the last successful save; photos go first so no day points at a missing photo */
async function cloudPersist(){
  if(cloud.writing){cloud.again=true;return;}
  cloud.writing=true;
  let failed=0,tooBig=false;
  const run=async jobs=>{
    for(let i=0;i&lt;jobs.length;i+=4){
      const res=await Promise.allSettled(jobs.slice(i,i+4).map(f=>f()));
      failed+=res.filter(r=>r.status==='rejected').length;
    }
  };
  try{
    const want=new Map();
    Object.keys(state.days).forEach(k=>{
      const d=state.days[k];if(!dayHas(d))return;
      [...d.dPhotos,...d.cPhotos].forEach(p=>want.set(k+'/'+p.id,{k:k,p:p}));
    });
    const photoJobs=[];
    want.forEach((v,key)=>{
      if(cloud.photos.has(key)||!v.p.src)return;
      photoJobs.push(async()=>{await cloudPhoto(v.k,v.p.id).set({src:v.p.src});cloud.photos.add(key);});
    });
    [...cloud.photos].forEach(key=>{
      if(want.has(key))return;
      photoJobs.push(async()=>{const i=key.indexOf('/');await cloudPhoto(key.slice(0,i),key.slice(i+1)).delete();cloud.photos.delete(key);});
    });
    await run(photoJobs);

    const dayJobs=[];
    const keys=new Set([...Object.keys(state.days),...[...cloud.saved.keys()].filter(k=>k!=='meta')]);
    keys.forEach(k=>{
      const d=state.days[k],has=!!d&amp;&amp;dayHas(d);
      const c=has?canon(dayStored(d)):null;
      if(c===(cloud.saved.has(k)?cloud.saved.get(k):null))return;
      if(has&amp;&amp;c.length>DOC_MAX){tooBig=true;return;}
      dayJobs.push(async()=>{
        if(has){await cloud.col.doc(k).set(JSON.parse(c));cloud.saved.set(k,c);}
        else{await cloud.col.doc(k).delete();cloud.saved.delete(k);}
      });
    });
    const mc=canon({pattern:normPattern(pat)});
    if(mc!==cloud.saved.get('meta'))dayJobs.push(async()=>{await cloud.col.doc('meta').set(JSON.parse(mc));cloud.saved.set('meta',mc);});
    await run(dayJobs);

    if(tooBig)toast("One day's notes are too long to sync. Shorten the longest diary entry.",6000);
    if(failed){
      toast("Couldn't sync just now. Your notes are safe on this device and will retry.",5000);
      dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(persist,6000);
    }else if(cloud.migrating){
      cloud.migrating=false;
      try{localStorage.setItem('imz-moved-'+cloud.uid,'1');}catch(e){}
    }
  }finally{
    cloud.writing=false;
    if(cloud.again){cloud.again=false;scheduleSave();}
    if(cloud.deferred&amp;&amp;!dirty)cloudApply(cloud.deferred);
  }
}
/* other devices' changes arrive here; while you're typing or a save is pending, they wait */
function cloudApply(snap){
  if(dirty||cloud.writing){cloud.deferred=snap;return;}
  cloud.deferred=null;
  let changed=false,meta;
  const remote=new Map();
  snap.docs.forEach(d=>{if(d.id==='meta')meta=d.data();else if(KEYRE.test(d.id))remote.set(d.id,d.data()||{});});
  new Set([...remote.keys(),...Object.keys(state.days)]).forEach(k=>{
    if(remote.has(k)){
      const nd=fromStored(remote.get(k),state.days[k]);
      const c=canon(dayStored(nd));
      if(c===cloud.saved.get(k))return;
      cloud.saved.set(k,c);cloudForget(k);
      [...nd.dPhotos,...nd.cPhotos].forEach(p=>cloud.photos.add(k+'/'+p.id));
      state.days[k]=nd;changed=true;
    }else if(cloud.saved.has(k)){
      cloud.saved.delete(k);cloudForget(k);delete state.days[k];changed=true;
    }
  });
  if(meta!==undefined){
    const next=normPattern(meta&amp;&amp;meta.pattern),pc=canon({pattern:next});
    if(pc!==cloud.saved.get('meta')){cloud.saved.set('meta',pc);cloud.meta=next;setPattern(next,'tween');}
  }
  if(changed){
    if(view.open&amp;&amp;pop.contains(document.activeElement))cloud.rerender=true;
    else renderAll();
  }
}
/* signs in to the synced copy; returns false (and the device keeps working locally) if it can't */
async function startCloud(){
  let db=null,uid=null;
  try{
    db=await within(window.claude.use('db'),6000);
    const user=await within(window.claude.use('user'),6000);
    uid=user?await within(user.id(),4000):null;
  }catch(e){}
  if(!db||!uid)return false;
  const col=db.collection('data/users/'+uid);
  let snap=null;
  try{snap=await within(col.get(),10000);}catch(e){}
  if(!snap){toast("Couldn't reach your synced notes. Showing this device's copy.",6000);return false;}
  cloud.col=col;cloud.uid=uid;
  state={days:{}};
  snap.docs.forEach(d=>{
    if(d.id==='meta'){const next=normPattern((d.data()||{}).pattern);cloud.meta=next;cloud.saved.set('meta',canon({pattern:next}));return;}
    if(!KEYRE.test(d.id))return;
    const nd=fromStored(d.data()||{},null);
    state.days[d.id]=nd;
    cloud.saved.set(d.id,canon(dayStored(nd)));
    [...nd.dPhotos,...nd.cPhotos].forEach(p=>cloud.photos.add(d.id+'/'+p.id));
  });
  /* this device's older local notes are merged in once, then never again */
  let moved=false;try{moved=!!localStorage.getItem('imz-moved-'+uid);}catch(e){}
  if(!moved){
    let local=null;
    try{await store.init();const raw=await store.get();if(raw)local=normState(raw);}catch(e){}
    if(local&amp;&amp;Object.keys(local.days).some(k=>dayHas(local.days[k]))){
      Object.keys(local.days).forEach(k=>{
        const ld=local.days[k];if(!dayHas(ld))return;
        if(state.days[k])mergeDay(state.days[k],ld);else state.days[k]=ld;
      });
      cloud.migrating=true;
    }else{try{localStorage.setItem('imz-moved-'+uid,'1');}catch(e){}}
  }
  cloud.on=true;loaded=true;
  if(cloud.migrating)scheduleSave();
  col.onSnapshot(cloudApply,()=>toast("Lost the connection to your synced notes. Changes will sync when it's back.",6000));
  return true;
}

let saveTimer=null,dirty=false;
function scheduleSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);}
async function persist(){
  clearTimeout(saveTimer);
  if(RO||!loaded||!dirty)return;
  dirty=false;
  prune();
  if(cloud.on){await cloudPersist();return;}
  try{await store.put(state);}
  catch(e){toast('Could not save. Storage may be full. Export a backup to keep your notes.',6000);}
}
addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,ms){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms||3000);
}

/* ---------- grid ---------- */
const grid=$('grid'),gridScroll=$('gridScroll'),wrap=$('gridWrap'),pop=$('pop'),popBody=$('popBody');
document.body.appendChild(pop);   /* lives at page level so the calendar's scrolling never clips it */

function buildGrid(){
  $('yearLabel').textContent=view.year;
  grid.replaceChildren(el('div',{class:'corner'}));
  MONTHS.forEach((m,i)=>grid.append(el('div',{class:'mh','data-m':i+1},m)));
  for(let d=1;d&lt;=31;d++){
    grid.append(el('div',{class:'dl','data-d':d},String(d)));
    for(let m=1;m&lt;=12;m++){
      if(d&lt;=dim(view.year,m)){
        const k=keyOf(view.year,m,d);
        grid.append(el('button',{class:'dot',type:'button','data-key':k,'data-m':m,'data-d':d,'aria-label':fmtLong(k)}));
      }else grid.append(el('div',{'aria-hidden':'true'}));
    }
  }
}
function refreshGrid(){
  const t=parseKey(today),cur=view.year===t.y;
  grid.querySelectorAll('.mh').forEach(h=>h.classList.toggle('now',cur&amp;&amp;+h.dataset.m===t.m));
  grid.querySelectorAll('.dl').forEach(h=>h.classList.toggle('now',cur&amp;&amp;+h.dataset.d===t.d));
  grid.querySelectorAll('.dot').forEach(b=>{
    const k=b.dataset.key;
    b.classList.toggle('past',k&lt;today);
    b.classList.toggle('today',k===today);
    b.classList.toggle('future',k>today);
    b.classList.toggle('has',hasData(k));
    b.classList.toggle('sel',k===view.open);
  });
}
function dotFor(k){return grid.querySelector('.dot[data-key="'+k+'"]');}

/* ---------- hover preview ---------- */
const tip=$('tip');
function showTip(b){
  if(noHover.matches||b.classList.contains('sel')){hideTip();return;}
  const k=b.dataset.key,d=state.days[k];
  tip.replaceChildren(el('div',{class:'tt-date'},fmtTip(k)));
  const todos=d?d.todos:[],dls=d?d.deadlines:[];
  if(!todos.length&amp;&amp;!dls.length)tip.append(el('div',{class:'tt-empty'},'Nothing planned'));
  todos.slice(0,6).forEach(t=>tip.append(el('div',{class:'tt-item'+(t.done?' done':'')},(t.done?'✓ ':'○ ')+t.text)));
  if(todos.length>6)tip.append(el('div',{class:'tt-more'},'+ '+(todos.length-6)+' more'));
  if(dls.length){
    tip.append(el('div',{class:'tt-date tt-sub'},'Deadlines'));
    dls.slice(0,4).forEach(t=>tip.append(el('div',{class:'tt-item'+(t.done?' done':'')},(t.done?'✓ ':'○ ')+t.text)));
  }
  tip.hidden=false;
  const r=b.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let left=r.left+r.width/2+parseFloat(getComputedStyle(b).height)*.38+10;
  if(left+w>innerWidth-8)left=r.left+r.width/2-parseFloat(getComputedStyle(b).height)*.38-10-w;
  tip.style.left=Math.max(8,left)+'px';
  tip.style.top=clamp(r.top+r.height/2-14,8,innerHeight-h-8)+'px';
}
function hideTip(){tip.hidden=true;}
grid.addEventListener('mouseover',e=>{const b=e.target.closest('.dot');if(b)showTip(b);else hideTip();});
grid.addEventListener('mouseleave',hideTip);
gridScroll.addEventListener('scroll',hideTip,{passive:true});

/* ---------- popover ---------- */
function centerTarget(dot){
  const sc=gridScroll,s=sc.getBoundingClientRect(),r=dot.getBoundingClientRect();
  const pr=pop.hidden?null:pop.getBoundingClientRect();
  const desiredX=(!sheetMQ.matches&amp;&amp;pr)?Math.min(s.width/2,(pr.left-s.left)/2):s.width/2;   /* keep the day clear of the panel */
  const desiredY=sheetMQ.matches?40+(Math.max(innerHeight*.3-s.top,120)-40)/2:40+(s.height-40)/2;
  const tx=clamp(sc.scrollLeft+(r.left+r.width/2-s.left)-desiredX,0,Math.max(0,sc.scrollWidth-sc.clientWidth));
  const ty=clamp(sc.scrollTop+(r.top+r.height/2-s.top)-desiredY,0,Math.max(0,sc.scrollHeight-sc.clientHeight));
  return{tx,ty};
}
/* the panel sits in the bottom-right; only its opening animation points back at the circle */
function layoutPop(dot,tgt){
  if(sheetMQ.matches){pop.style.transformOrigin='';return;}
  const dr=dot.getBoundingClientRect(),pr=pop.getBoundingClientRect();
  const fx=dr.left+dr.width/2-(tgt.tx-gridScroll.scrollLeft);
  const fy=dr.top+dr.height/2-(tgt.ty-gridScroll.scrollTop);
  pop.style.transformOrigin=(fx-pr.left)+'px '+(fy-pr.top)+'px';
}
function openDay(k,tab){
  const p=parseKey(k);
  if(p.y!==view.year){view.year=p.y;buildGrid();}
  view.open=k;
  document.body.classList.add('pop-open');
  if(tab)view.tab=tab;
  refreshGrid();
  hideTip();
  const dot=dotFor(k);
  pop.hidden=false;
  renderPop();
  const phone=mobileMQ.matches;
  const tgt=phone?{tx:0,ty:0}:centerTarget(dot);
  layoutPop(dot,tgt);
  pop.classList.remove('in');void pop.offsetWidth;pop.classList.add('in');
  if(phone){
    const r=dot.getBoundingClientRect();
    window.scrollTo({top:Math.max(0,window.scrollY+r.top+r.height/2-innerHeight*.15),behavior:reduceMotion()?'auto':'smooth'});
  }else gridScroll.scrollTo({left:tgt.tx,top:tgt.ty,behavior:reduceMotion()?'auto':'smooth'});
  if(!noHover.matches){const a=popBody.querySelector('.add');if(a)a.focus({preventScroll:true});}
}
function closePop(){view.open=null;pop.hidden=true;document.body.classList.remove('pop-open');refreshGrid();}

function nbOn(tab){

  return !!(viewSettings&amp;&amp;viewSettings.enabled&amp;&amp;viewSettings.nb&amp;&amp;viewSettings.nb[tab]);

function renderPop(){

  popBody.hidden=!avail.length;

}
function renderDl(focus){

  if(RO){box.hidden=!nbOn('deadlines');if(box.hidden)return;}
  box.replaceChildren(el('h3',null,'Deadlines'),listView(k,'deadlines','Add a deadline','New deadline'));

function renderBody(focusSel){

function autosize(ta){ta.style.height='auto';ta.style.height=Math.max(260,ta.scrollHeight)+'px';}
function mutated(){scheduleSave();refreshGrid();renderDeadlines();}

/* to-do and deadlines */
function roRow(t){
  return el('div',{class:'row ro'+(t.done?' done':'')},el('span',{class:'cb'+(t.done?' on':''),'aria-hidden':'true'}),el('span',{class:'txt-ro'},t.text));
}
function listView(k,key,placeholder,label){
  const wrapEl=el('div');
  if(RO){
    const d0=day(k,false),l0=d0?d0[key]:[];
    if(!l0.length)return el('div',{class:'ro-empty'},'Nothing here.');
    l0.filter(t=>!t.done).concat(l0.filter(t=>t.done)).forEach(t=>wrapEl.append(roRow(t)));
    return wrapEl;
  }
  const input=el('input',{type:'text',class:'add',placeholder:placeholder,maxlength:300,'aria-label':label});
  const add=el('button',{type:'button',class:'btn'},'Add');
  const submit=()=>{
    const text=input.value.trim();if(!text)return;

function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
async function shrink(file){
  const src=await readFile(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=src;});
  const encode=(scale,q)=>{
    const c=document.createElement('canvas');
    const f=Math.min(1,1280/Math.max(img.width,img.height))*scale;
    c.width=Math.max(1,Math.round(img.width*f));c.height=Math.max(1,Math.round(img.height*f));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  };
  for(const scale of [1,.75,.6])for(const q of [.82,.72,.62,.52]){
    const out=encode(scale,q);
    if(out.length&lt;=PHOTO_MAX)return out;
  }
  throw new Error('too large');
}

/* ---------- search ---------- */
const qEl=$('q'),resEl=$('results');
let searchTimer=null;
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;');}
function snippet(text,tokens){
  const max=170,l=text.toLowerCase();
  let first=Infinity;tokens.forEach(t=>{const i=l.indexOf(t);if(i>=0)first=Math.min(first,i);});
  const start=text.length>max?Math.max(0,(first===Infinity?0:first)-50):0;
  const s=text.slice(start,start+max).replace(/\s+/g,' ');
  const frag=document.createDocumentFragment();
  if(start>0)frag.append('…');
  const re=new RegExp('('+tokens.map(escRe).join('|')+')','gi');
  s.split(re).forEach((part,i)=>{if(!part)return;if(i%2)frag.append(el('mark',null,part));else frag.append(part);});
  if(start+max&lt;text.length)frag.append('…');
  return frag;
}
function runSearch(){
  const q=qEl.value.trim().toLowerCase();
  if(!q){resEl.hidden=true;return;}
  const tokens=q.split(/\s+/).filter(Boolean);
  const test=txt=>{const l=txt.toLowerCase();return tokens.every(t=>l.indexOf(t)>=0);};
  const hits=[];
  for(const k of Object.keys(state.days)){
    const d=state.days[k];
    d.todos.forEach(t=>{if(test(t.text))hits.push({k:k,tab:'todo',label:'To-do',text:t.text});});
    d.deadlines.forEach(t=>{if(test(t.text))hits.push({k:k,tab:'deadlines',label:'Deadline',text:t.text});});
    CATS.forEach(c=>d.consumed[c[0]].forEach(e=>{if(test(e.text))hits.push({k:k,tab:'consumed',label:c[1],text:e.text});}));
    if(d.diary&amp;&amp;test(d.diary))hits.push({k:k,tab:'diary',label:'Diary',text:d.diary});
  }
  hits.sort((a,b)=>a.k&lt;b.k?1:a.k>b.k?-1:0);
  resEl.replaceChildren();
  if(!hits.length)resEl.append(el('div',{class:'meta'},'No matches.'));
  else{
    resEl.append(el('div',{class:'meta'},hits.length+(hits.length===1?' match':' matches')));
    hits.slice(0,60).forEach(h=>{
      const b=el('button',{type:'button',class:'hit'},
        el('span',{class:'when'},fmtHit(h.k),el('b',null,h.label)),
        el('span',{class:'what'}));
      b.querySelector('.what').append(snippet(h.text,tokens));
      b.onclick=()=>{resEl.hidden=true;openDay(h.k,h.tab==='deadlines'?undefined:h.tab);};
      resEl.append(b);
    });
    if(hits.length>60)resEl.append(el('div',{class:'meta'},'Showing the 60 most recent. Add more words to narrow it down.'));
  }
  resEl.hidden=false;
}
